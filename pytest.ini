[pytest]
# testpaths scopes the default run to the hermetic suite. tests-live/ talks to a real
# cluster and real upstreams and is run explicitly, by `make test-forge` and
# `make test-workspace`.
testpaths = tests
pythonpath = tests tests-live
addopts = -ra
markers =
    slow: takes minutes and spends real money (live model calls)
    # The two live-state gates. Registered here as well as in tests-live/conftest.py so that
    # `--strict-markers` and a bare `-m` selection both work from the repo root, and so the
    # names are discoverable from `pytest --markers` without collecting tests-live.
    # tests-live/conftest.py is what enforces them; see tests-live/live_identity.py for why
    # there are two halves (a collection gate AND a refusal inside the credential function).
    needs_real_user: signs in as, or drives the pod of, an account on the live deployment. Deselected unless EAI_LIVE_TEST_USER names a THROWAWAY-marked account.
    mutates_live_deployment: writes cluster state a live user depends on (a shared ConfigMap, a deployment restart). Deselected unless EAI_LIVE_MAINTENANCE_WINDOW is set.
