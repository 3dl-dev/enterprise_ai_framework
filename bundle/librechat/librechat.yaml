# Chat surface configuration.
#
# One control plane: the model catalogue and the upstream come from here, pushed by the
# bundle — the surface is not administered through its own console.
#
# The surface holds a virtual key, never a provider key. Everything it sends goes to the
# gateway, so chat traffic lands in the same ledger and the same audit trail as the
# coding agents.

# Config schema version. Must equal Constants.CONFIG_VERSION in the pinned LibreChat
# image (packages/data-provider/src/config.ts) — 1.3.13 for v0.8.7, 1.2.8 for v0.8.0.
# Asserted against the RUNNING container rather than a hardcoded string by
# tests/test_chat_surface_version.py::test_config_schema_version_matches_the_running_image.
#
# A mismatch is advisory, not fatal: packages/api/src/app/checks.ts#checkConfig only
# logs "Outdated Config version". That is precisely why it is worth a test — nothing
# else in the stack notices, and the drift is only visible in a log line nobody reads.
version: 1.3.13
cache: true

interface:
  # No local account management — Keycloak owns identity.
  privacyPolicy:
    externalUrl: ""
  termsOfService:
    externalUrl: ""
  # INERT — and left here deliberately, with a test holding it that way.
  # `artifacts` is not a key of librechat-data-provider's `interfaceSchema` in v0.8.0 or
  # v0.8.7, so zod strips it, and packages/data-schemas/src/app/interface.ts never reads
  # it; it is correspondingly absent from what the surface serves at /api/config. What
  # actually turns on the Claude-like rendering of code and HTML is `preset.artifacts` on
  # each model spec below, which is where the real setting lives and where
  # tests/test_chat_surface_version.py asserts it.
  # Kept so this note survives: the next person to find artifacts broken must not "fix"
  # it here. test_the_interface_artifacts_key_is_inert fails if a release starts
  # honouring the key, which is when this comment needs rewriting.
  artifacts: true
  # Surfaces the memories panel in Settings so a user can see/edit what was stored.
  # Purely a UI toggle — does not gate whether memory is extracted (see `memory` below).
  memories: true

# LibreChat's native memory (api/server/routes/memories.js + the `memory` Mongo
# collection in data-schemas) — CONFIGURED, not built. A durable per-user preference
# stated in one conversation is available in every later conversation because it is
# read from Mongo on every turn (api/server/controllers/agents/client.js #useMemory),
# not from anything held in the chat process — a deployment restart does not lose it.
#
# `agent.provider` must equal an `endpoints.custom[].name` below EXACTLY
# (server/services/Endpoints/index.js#getProviderConfig falls through to
# getCustomEndpointConfig by exact string match when the provider isn't one of the
# built-in EModelEndpoint/Providers names) — so the memory-extraction agent is routed
# through our own gateway on the chat surface's virtual key, same as any other model
# call: same ledger, same audit trail, no second credential.
#
# Model choice: glm-5.2@deepinfra, not the cheaper glm-4.7 — memory extraction is a
# tool call (`set_memory`/`delete_memory`) on every turn, and glm-5.2 is the model
# this bundle has actually measured invoking tools reliably (wave 1). Getting this
# wrong is silent (the model just answers instead of calling the tool) rather than a
# visible error, so it is not a place to guess.
#
# Left on the library's default instructions/behavior (see librechat's
# getDefaultInstructions): memory is written only when the user explicitly asks to be
# remembered ("remember that...", "don't forget..."), not opportunistically mined from
# every message — matching the item's own scenario ("a user tells the chat a durable
# preference").
#
# `agent.enabled: true` is REQUIRED from v0.8.6 onwards and was not required at v0.8.0.
# packages/data-schemas/src/app/memory.ts#isMemoryAgentEnabled now returns false unless
# `config.agent.enabled === true`, so the same config that extracted memories on v0.8.0
# extracts nothing on v0.8.7 — the memories panel still renders, the routes still answer,
# and every conversation simply stops learning anything. The only signal is one startup
# line: "[memory] Agent config detected without explicit `enabled: true`". Found by
# reading the v0.8.7 container's own boot log during enterpriseaiframework-f50, not by
# reading the changelog, which does not mention it.
#
# Safe on v0.8.0 as well: its memorySchema agent union is a plain (non-strict) z.object,
# so an unknown `enabled` key is stripped rather than rejected, and v0.8.0 extracted
# unconditionally anyway.
memory:
  personalize: true
  messageWindowSize: 5
  agent:
    enabled: true
    provider: "Enterprise AI"
    model: "glm-5.2@deepinfra"

# Defaults. Without these the surface opens with nothing selected and the user has to
# know which of eleven models to pick before they can type anything — which reads as
# "unconfigured", not "flexible".
modelSpecs:
  enforce: false        # the full catalogue stays reachable
  prioritize: true      # but open on a sensible default
  list:
    - name: glm-5-2
      label: "GLM 5.2"
      default: true
      description: "Open weights. $0.93/$3.00 per Mtok — about a third of Sonnet 5, a ninth of Opus."
      preset:
        endpoint: "Enterprise AI"
        model: "glm-5.2@deepinfra"
        artifacts: "default"
        # Matches the provider: 200k context, and the full output budget. These models
        # spend part of the output budget reasoning, so a short cap truncates the answer
        # after the thinking rather than producing a smaller answer.
        maxContextTokens: 200000
        maxOutputTokens: 32768
        # NO promptPrefix (enterpriseaiframework-8b5). One used to live here: ~10 lines,
        # every one of them about emitting runnable HTML, ending in a worked
        # <!DOCTYPE html> example, with nothing about prose. That is standing context on
        # every turn of every conversation, so an ambiguous message ("make it a lot
        # sorter", a typo for "shorter") read as a request to build a program, and GLM
        # built one. FOUND IN USE: see docs/design/dogfood-findings.md and the item.
        #
        # It was also redundant on both things it tried to do:
        #   - WHEN to use an artifact: `artifacts: "default"` below already makes
        #     LibreChat inject its own artifact system prompt
        #     (api/app/clients/prompts/artifacts.js, generateArtifactsPrompt), which
        #     already states the HTML/React/Mermaid/SVG types, the format, and — unlike
        #     the prompt removed here — explicit guidance on when NOT to use one
        #     ("prefer in-line content", "err on the side of not creating an artifact").
        #   - HOW to open the fence: the removed prompt's only other job was drilling
        #     GLM into using three colons instead of the two it actually emits.
        #     deploy/gateway/strip_reasoning.py's `_OPEN_FENCE` regex already rewrites
        #     `:{1,4}artifact{` to `:::artifact{` deterministically, on both the
        #     streaming and non-streaming paths, for every surface and every model
        #     (24fe929) — whose own commit message records that prompting the fence
        #     was tried first, twice, and did not hold. That gateway rewrite is what
        #     actually owns fence correctness; a model-side prompt asking nicely for
        #     three colons was never going to be reliable and doesn't need to try.
    - name: glm-4-7
      label: "GLM 4.7 (cheapest)"
      description: "Open weights. $0.40/$1.75 per Mtok — the cheapest priced model in the catalogue."
      preset:
        endpoint: "Enterprise AI"
        model: "glm-4.7@deepinfra"
        artifacts: "default"
        maxContextTokens: 128000
        maxOutputTokens: 32768
        # NO promptPrefix — same reasoning as glm-5-2 above (enterpriseaiframework-8b5).

registration:
  # Only identities from the realm. Belt and braces alongside ALLOW_REGISTRATION=false.
  socialLogins: ["openid"]

# MCP SSRF allowlist. NEW REQUIREMENT — v0.8.6+ refuses to connect to any MCP server
# whose host resolves into private IP space unless it is exempted here
# (packages/api/src/auth/domain.ts#isMCPDomainAllowed -> isSSRFTarget /
# resolveHostnameSSRF). `mcp-echo` is a container/Service name on a private network, so
# without this the v0.8.7 surface starts perfectly healthy and logs
#   [MCP][echo] Failed to initialize: Domain "http://mcp-echo:8080" is not allowed
#   [MCP] Initialized with 1 configured server and 0 tools.
# — one configured server, zero tools. Nothing user-visible fails until a model tries to
# call the tool and cannot see it. Observed on the v0.8.7 bundle before this block existed.
#
# allowedAddresses (host:port exemptions), NOT allowedDomains. An `allowedDomains` list
# turns SSRF protection off wholesale for MCP —
# MCPServerInspector.inspect sets `useSSRFProtection = !allowedDomains?.length` — whereas
# allowedAddresses exempts exactly one host and one port and leaves the protection on for
# everything else. Same reasoning as NODE_EXTRA_CA_CERTS being scoped to our own CA
# rather than disabling certificate verification.
#
# WARNING — THIS KEY IS FATAL ON v0.8.0. `mcpSettings` does not exist in v0.8.0's
# configSchema, and the schema is parsed with `.strict()` at the top level, so v0.8.0
# rejects the whole file and its loadCustomConfig returns null: no custom endpoint, no
# modelSpecs, no memory, no MCP, and a surface that still answers /health with 200. The
# image pin and this file must therefore move together on every deployment
# (bundle/docker-compose.yml and deploy/k8s/50-chat.yaml — deploy/bin/deploy.sh renders
# THIS file into the cluster's chat-config ConfigMap).
mcpSettings:
  allowedAddresses:
    - "mcp-echo:8080"

mcpServers:
  # The trivial MCP server (enterpriseaiframework-12b). Proves the wiring ONCE — one
  # tool, `echo`, that returns a value the model cannot produce on its own
  # (`ECHO:<input>`) — before web-search, skills and code-execution are built as real
  # MCP servers on the same path. Deployed as its own Service in the cluster
  # (deploy/k8s/06-mcp-echo.yaml, source in mcp-echo/), reached over streamable-http so
  # LibreChat calls it as a network peer rather than spawning it as a subprocess inside
  # its own container.
  echo:
    type: streamable-http
    url: "http://mcp-echo:8080/mcp"
    chatMenu: true

endpoints:
  custom:
    - name: "Enterprise AI"
      apiKey: "${CHAT_VIRTUAL_KEY}"
      baseURL: "http://gateway:4000/v1"
      models:
        # Fetched from the gateway so the catalogue has exactly one source.
        default: ["glm-5.2@deepinfra", "glm-4.7@deepinfra"]
        fetch: true
      titleConvo: true
      # The model that NAMES a conversation. It was "fake-small", which is the local
      # bundle's stub provider — harmless on a laptop, and the reason every conversation
      # in the cluster was titled "[fake-provider fake-gpt-small] ack <hex>". The chats
      # themselves were real; only their names came from a stub, which made a working
      # history look like a broken one.
      #
      # Titling is one short call per conversation, so it goes to the cheaper of the two
      # real models rather than the default one.
      titleModel: "glm-4.7@deepinfra"
      modelDisplayLabel: "Enterprise AI"
      # ATTRIBUTION — this note used to say chat spend attributes to the surface as a
      # whole rather than to the signed-in user, and that forwarding the user via
      # addParams had been tried and removed. Both are now out of date, corrected against
      # the cluster ledger 2026-07-29: chat rows carry a per-user `end_user` value, so
      # chat spend IS attributed per person.
      #
      # What arrives there is LibreChat's own primary key (a 24-char Mongo ObjectId),
      # which is correct, stable, and useless to show a human.
      # control-plane/app/chat_identity.py translates it, read-only, over one collection.
      #
      # Still open (rd f8c): that translation is applied in the portal and NOT in
      # GET /admin/spend, so `make spend` — the query scope item 4 actually names —
      # prints hex for the chat surface while the console prints names. Same data, same
      # query, two answers.
      #
      # The original reasoning still stands and is why nothing here forwards the user
      # explicitly: {{LIBRECHAT_USER_ID}} substitution is only demonstrably supported for
      # headers, and an unsubstituted placeholder would write the literal string into the
      # bill as a username — worse than having no per-user chat attribution at all.
