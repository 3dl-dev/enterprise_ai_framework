# The reference bundle: one command, one host, no GPU (scope item 8).
#
# Defaults are wired to the fake provider so this comes up and is testable end to end
# with no provider account and no spend. Point the gateway at real upstreams by editing
# litellm/config.yaml and setting the provider keys in .env — nothing else changes.

# A worktree checkout gets its own project name and its own port block, rendered into
# .env by bin/render-env.sh (enterpriseaiframework-0e3) — otherwise every worktree's
# `docker compose up/down` would operate on the SAME containers as the primary checkout.
name: ${COMPOSE_PROJECT_NAME:-enterprise-ai}

x-postgres-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-eai}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *pg-env
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: identity,gateway,controlplane
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eai} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  fakeprovider:
    build: ../fakeprovider
    # Published so the exit-path test can reach "the provider" directly, the way a
    # surface would once the layer is removed. A real provider is on the internet;
    # this stands in for that reachability.
    ports:
      - "${FAKEPROVIDER_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.4
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IDP_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDP_ADMIN_PASSWORD:?set IDP_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identity
      KC_DB_USERNAME: ${POSTGRES_USER:-eai}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # One issuer URL for everyone — the host's own IP, which the browser reaches
      # directly and containers reach because published ports bind on the host.
      # Backchannel-dynamic is deliberately NOT used: it
      # makes the discovery document report a different issuer than the one the client
      # requested, and the OIDC client rejects that mismatch outright.
      KC_HOSTNAME: https://${IDP_PUBLIC_HOST}:${IDP_HTTPS_PORT:-8443}
      # TLS is required by the chat surface's OIDC client, which refuses plaintext
      # discovery. Plain HTTP stays available on 8080 for control-plane admin calls
      # inside the compose network.
      KC_HTTPS_CERTIFICATE_FILE: /certs/identity.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/identity.key
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ./certs:/certs:ro
    ports:
      - "${IDP_PORT:-8082}:8080"
      - "${IDP_HTTPS_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Probe the realm endpoint over plain HTTP on 8080. The management/health port
      # switches to HTTPS as soon as a certificate is configured, so a plaintext probe
      # against 9000 reports unhealthy on a server that is working fine. The JVM image
      # has no curl, hence bash's /dev/tcp. Hitting the realm also proves the import
      # landed, which a liveness probe would not.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/${IDP_REALM:-enterprise-ai} HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  gateway:
    image: ghcr.io/berriai/litellm:main-v1.77.3-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${GATEWAY_SALT_KEY:?set GATEWAY_SALT_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-eai}:${POSTGRES_PASSWORD}@postgres:5432/gateway
      REDIS_URL: redis://valkey:6379
      # Real upstreams go here. Unset in the default bundle — the fake provider needs none.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Forge agent key. Runtime inference only — it can spend, not mint keys. The
      # admin key deliberately never reaches a container.
      FORGE_API_KEY: ${FORGE_API_KEY:-}
    volumes:
      - ./litellm/config.generated.yaml:/app/config.yaml:ro
      # The callback module config.yaml names. litellm imports it by bare module name from
      # the working directory, so it has to sit next to config.yaml — without it the proxy
      # raises ImportError at startup and crash-loops. Same file the cluster mounts.
      - ../deploy/gateway/strip_reasoning.py:/app/strip_reasoning.py:ro
      - ../deploy/gateway/require_principal.py:/app/require_principal.py:ro
      - ../deploy/gateway/flush_spend_on_shutdown.py:/app/flush_spend_on_shutdown.py:ro
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      fakeprovider:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  control-plane:
    build: ../control-plane
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql://${POSTGRES_USER:-eai}:${POSTGRES_PASSWORD}@postgres:5432/controlplane
      GATEWAY_DATABASE_URL: postgresql://${POSTGRES_USER:-eai}:${POSTGRES_PASSWORD}@postgres:5432/gateway
      GATEWAY_URL: http://gateway:4000
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY}
      IDP_URL: http://identity:8080
      IDP_REALM: ${IDP_REALM:-enterprise-ai}
      IDP_CLIENT_ID: control-plane
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET:?set IDP_CLIENT_SECRET in .env}
      CONTROL_PLANE_ADMIN_TOKEN: ${CONTROL_PLANE_ADMIN_TOKEN:?set CONTROL_PLANE_ADMIN_TOKEN in .env}
      # Read-only, one collection, two fields: the map from LibreChat's internal user id
      # to a username. The cluster has always set this (deploy/k8s/40-control-plane.yaml);
      # the bundle did not, which is the direct reason `make test` could not see finding
      # 34 — with no map, no chat row here ever carried an ObjectId, so the code path that
      # has to translate one was never exercised by any test. The fixture was more uniform
      # than production. See app/chat_identity.py for how it fails safe when absent.
      CHAT_MONGO_URL: mongodb://chatdb:27017
      CHAT_MONGO_DB: librechat
      # Who sees the operator console. The cluster sets this
      # (deploy/k8s/40-control-plane.yaml); the bundle did not, so the console rendering
      # of the bill — one of the two renderings that disagreed in finding 34 — did not
      # exist here to be tested against. Empty is still the safe default everywhere else:
      # a deployment that names nobody gets no console.
      PORTAL_ADMINS: ${PORTAL_ADMINS:-${BOOTSTRAP_USER:-baron}}
    ports:
      - "${CONTROL_PLANE_PORT:-8081}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
      identity:
        condition: service_started
      # Only so the map is loadable when the bill is first rendered. The control plane
      # starts and serves without it — an unreachable chat database costs a label, never
      # a bill — so this is service_healthy for test determinism, not for correctness.
      chatdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # LibreChat's own store. Mongo is LibreChat's requirement, not ours — it holds
  # conversations, not control-plane state. Postgres stays welded for everything that is
  # ours (ledger, audit, principals).
  # The trivial MCP server (enterpriseaiframework-12b), mirrored here so the compose
  # bundle and the cluster (deploy/k8s/06-mcp-echo.yaml) do not diverge: librechat.yaml
  # is the one file both environments mount, and LibreChat tries to connect every
  # configured mcpServers entry at startup regardless of whether ENDPOINTS includes
  # `agents` — an mcpServers entry with no matching compose service would leave `chat`
  # trying to resolve a hostname that does not exist in this network.
  mcp-echo:
    build: ../mcp-echo
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---- web search (enterpriseaiframework-0be) --------------------------------------
  #
  # Three services: all three of LibreChat's native web_search legs are supplied, none
  # left to LibreChat's own paid-only defaults:
  #   search  -> searxng   self-hosted, no key, AGPL over HTTP and never patched
  #   scrape  -> webfetch  ours, Apache-2.0; every option LibreChat ships needs a paid key
  #   rerank  -> rerank    ours, Apache-2.0; jina/cohere both need a paid key, and
  #                        `rerankerType: none` authenticates for free but silently
  #                        withholds every fetched page from the model (see rerank/app.py
  #                        and the rerankerType comment in librechat.yaml)
  #
  # The reason the scrape leg cannot simply be left unset is in webfetch/app.py: with no
  # scraper key LibreChat's Firecrawl client returns success:false BEFORE issuing any
  # request, so web_search still answers with search-engine snippets and links and the
  # model cites pages that were never retrieved. Well-formed and wrong.
  searxng:
    image: searxng/searxng:latest
    environment:
      # Point SearXNG at our mounted config rather than /etc/searxng/settings.yml. The
      # entrypoint runs `chown -R` over /etc/searxng, which fails noisily against a
      # read-only bind mount inside it; a separate path keeps the mount read-only and the
      # startup log clean. Rendered from searxng/settings.template.yml by bin/render-env.sh.
      SEARXNG_SETTINGS_PATH: /etc/searxng-config/settings.yml
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng-config/settings.yml:ro
    healthcheck:
      # Probe the JSON API, not /healthz. `format=json` is disabled by default in SearXNG
      # and is the single setting the whole search leg depends on — a liveness probe would
      # report healthy on an instance that answers 403 to every query LibreChat makes.
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys;d=json.load(urllib.request.urlopen('http://localhost:8080/search?q=enterprise+ai&format=json',timeout=10));sys.exit(0 if 'results' in d else 1)\""]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  webfetch:
    build: ../webfetch
    environment:
      # Presented by LibreChat as `firecrawlApiKey`. MUST be non-empty: LibreChat's client
      # skips the request entirely when its key is empty, and this service fails closed on
      # an unset token, so an empty value here is the silent no-fetch case twice over.
      WEBFETCH_TOKEN: ${WEBFETCH_TOKEN:?set WEBFETCH_TOKEN in .env}
      # Private address space stays blocked. Empty allowlist is the secure default; a
      # deployment that wants its own intranet searchable names those hosts here.
      WEBFETCH_ALLOW_HOSTS: ${WEBFETCH_ALLOW_HOSTS:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys;d=json.load(urllib.request.urlopen('http://localhost:3002/health'));sys.exit(0 if d.get('token_configured') else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rerank:
    build: ../rerank
    environment:
      # Presented by LibreChat as `jinaApiKey`. MUST be non-empty for the same reason
      # WEBFETCH_TOKEN is: this service fails closed on an unset token, and an empty
      # value here would make grounding silently fall back to JinaReranker's own
      # first-N-chunks-score-0 default ranking.
      RERANK_TOKEN: ${RERANK_TOKEN:?set RERANK_TOKEN in .env}
    healthcheck:
      # Asserts token_configured, not just liveness: a reranker that 401s every request
      # would otherwise look healthy while grounding silently degrades to LibreChat's
      # built-in fallback (see rerank/app.py's /reranklog, which is what distinguishes
      # the two).
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys;d=json.load(urllib.request.urlopen('http://localhost:3003/health'));sys.exit(0 if d.get('token_configured') else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---- file search (enterpriseaiframework-c7c) -------------------------------------
  #
  # Storage and retrieval are ours: a dedicated Postgres/pgvector instance (same
  # database technology as the welded platform state, a separate instance for the same
  # reason chatdb is a separate Mongo — this is rag_api's own requirement, not a change
  # to the platform's state layer) plus rag_api itself (danny-avila/rag_api, MIT,
  # no user-count/seat/feature trigger), the FastAPI service LibreChat's own
  # file_search tool talks to. No hosted/third-party vector service is in the data
  # path — everything below runs in this compose network.
  ragvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragapi
      POSTGRES_USER: ${RAGVECTOR_USER:-ragapi}
      POSTGRES_PASSWORD: ${RAGVECTOR_PASSWORD:?set RAGVECTOR_PASSWORD in .env}
    volumes:
      - ragvectordata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAGVECTOR_USER:-ragapi} -d ragapi"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # LibreChat's own document_routes.py double-checks every /query against the
  # embedding-time `user_id` stored in pgvector's document metadata, independent of
  # whatever LibreChat's backend already filtered — partition by construction at TWO
  # layers, not one, and the identity on both sides comes from a JWT LibreChat's
  # backend signs SERVER-SIDE with the AUTHENTICATED user's id (packages/api's
  # generateShortLivedToken), never from anything a caller asserts (Finding 27). Shares
  # JWT_SECRET with `chat` for exactly that reason: rag_api verifies the signature
  # itself rather than trusting the bearer at face value.
  #
  # RAG_OPENAI_BASEURL points at the GATEWAY, not at any provider directly — an
  # uploaded file's embedding call is billed and audited like any other request,
  # attributed to the RAG_VIRTUAL_KEY principal minted below (bin/provision-rag-key.sh).
  # Measured, not assumed: tests/test_file_search.py asserts a ledger row lands under
  # that alias for every embed call. What it does NOT do — see the same test file and
  # the item's own finding — is attribute that spend to the individual uploading user;
  # rag_api's embeddings client is one process-wide instance with no per-request `user`
  # field, so the granularity here is "the file-search service", not "the uploader",
  # same shape as chat's own CHAT_VIRTUAL_KEY being one shared surface credential.
  #
  # `EMBEDDINGS_MODEL: fake-embed` is the bundle default (fakeprovider/app.py's
  # deterministic /v1/embeddings, scope item 8: testable with no provider account).
  # Swap to a real embeddings model by pointing this at one already in the gateway's
  # catalog — no other file changes.
  rag-api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      DB_HOST: ragvector
      DB_PORT: "5432"
      POSTGRES_DB: ragapi
      POSTGRES_USER: ${RAGVECTOR_USER:-ragapi}
      POSTGRES_PASSWORD: ${RAGVECTOR_PASSWORD:?set RAGVECTOR_PASSWORD in .env}
      RAG_PORT: "8000"
      JWT_SECRET: ${CHAT_JWT_SECRET:?set CHAT_JWT_SECRET in .env}
      EMBEDDINGS_PROVIDER: openai
      EMBEDDINGS_MODEL: fake-embed
      RAG_OPENAI_BASEURL: http://gateway:4000/v1
      RAG_OPENAI_API_KEY: ${RAG_VIRTUAL_KEY:-}
    depends_on:
      ragvector:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  chatdb:
    image: mongo:7
    command: ["--quiet"]
    volumes:
      - chatdbdata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------------
  # meilisearch: conversation search (enterpriseaiframework-2a6). Configuration, not
  # construction — LibreChat v0.8.7 ships native search (api/server/routes/search.js,
  # packages/data-schemas/src/methods/conversation.ts's meiliSearch branch of
  # getConvosByCursor, and the mongoMeili mongoose plugin that indexes every message
  # and conversation on save). Turning it on is SEARCH=true + MEILI_HOST +
  # MEILI_MASTER_KEY on the chat container below and this service.
  #
  # LICENSE: self-hosting the OSS `getmeili/meilisearch` image. The engine itself is
  # MIT (LICENSE-MIT); only Meilisearch's Enterprise Edition extensions (multi-tenant
  # SSO/RBAC dashboards, analytics add-ons) sit under a separate BSL-1.1 file
  # (LICENSE-EE) and are not used here — this deployment runs the community search
  # and filter API only, no seat/feature/user-count gate on the capability we use.
  # Passes the component-defaults rule.
  #
  # Per-user scoping is NOT something we build: mongoMeili tags every indexed
  # document with the owning user, api/server/routes/convos.js's GET / always scopes
  # its Mongo query to req.user.id first, and the meiliSearch call itself is issued
  # with `filter: user = "<searching user's id>"`. Search never returns another
  # user's conversation. tests/test_conversation_search.py proves this end to end,
  # including the negative case (rd 2a6 done condition).
  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_ENV: production
      # Air-gap capable: MEILI_NO_ANALYTICS stops Meilisearch's own anonymous-usage
      # ping to its own telemetry endpoint. Not 3DL's telemetry (there is none in this
      # data path either way) — this is Meilisearch's own default phone-home, off.
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      # 127.0.0.1, NOT localhost: this image resolves `localhost` to ::1 first via
      # /etc/hosts/nsswitch, but meilisearch only binds the IPv4 0.0.0.0:7700 —
      # `wget http://localhost:7700` connection-refuses forever against ::1 while the
      # server is genuinely healthy on IPv4. Measured on this exact image (v1.11).
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:7700/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------------
  # codeapi: ClickHouse/code-interpreter (Apache 2.0, vendored at bundle/codeapi, pinned
  # 4b72e9d0), the sandbox that gives chat real code execution (enterpriseaiframework-082).
  #
  # RULING (see rd item history): option (a), this sandbox alone. No workspace-pod
  # execution — chat and the terminal agent stay separate worlds, no shared files. That
  # is an accepted product loss, chosen because a workspace-scoped path can be added
  # later (additive, reversible) while the reverse cannot be withdrawn once files and
  # user expectations accumulate.
  #
  # NsJail isolation mode ONLY (KVM_ENABLED=false, target sandbox-build). The libkrun
  # microVM path — its own guest kernel, the Rust launcher, a baked ext4 rootfs, ~15-20GB
  # of build peak — is real ADDITIVE hardening this deployment does NOT have yet. NsJail
  # alone (namespaces/cgroups + seccomp + the egress gateway in front of all
  # sandbox-originated traffic + hardened-sandbox-mode) is still a serious isolation
  # boundary — more than this item would have built from scratch — just weaker than the
  # microVM configuration upstream's own README calls out by name. That gap is
  # deliberate and is not to be closed silently; see docs/design/dogfood-findings.md.
  #
  # Its own Valkey and its own S3 store (MinIO) — never the bundle's shared Valkey,
  # which has no password and every codeapi component requires REDIS_PASSWORD.
  codeapi-redis:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --requirepass
      - ${CODEAPI_REDIS_PASSWORD:?set CODEAPI_REDIS_PASSWORD in .env}
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
    volumes:
      - codeapiredisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$CODEAPI_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      CODEAPI_REDIS_PASSWORD: ${CODEAPI_REDIS_PASSWORD}
    restart: unless-stopped

  codeapi-minio:
    image: quay.io/minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - codeapiminiodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # HTTP gateway. LibreChat's LIBRECHAT_CODE_BASEURL points here. Named `codeapi` (not
  # `codeapi-api`) because that hostname is baked into the chat container's env below.
  codeapi:
    build:
      context: ./codeapi
      dockerfile: service/Dockerfile
      target: api
    environment:
      LOCAL_MODE: "false"
      CODEAPI_HARDENED_SANDBOX_MODE: "true"
      # LibreChat mints a <=300s EdDSA JWT per request naming the AUTHENTICATED user
      # (packages/api/src/auth/codeapi.ts) — the ONLY credential that gets to assert who
      # the caller is (Finding 27). LIBRECHAT_CODE_API_KEY does not exist in the pinned
      # LibreChat image (v0.8.7) and setting it configures nothing; do not add it back.
      CODEAPI_AUTH_PROVIDER: librechat-jwt
      CODEAPI_JWT_PUBLIC_KEY: ${CODEAPI_JWT_PUBLIC_KEY}
      CODEAPI_JWT_KID: lc-codeapi-bundle-1
      CODEAPI_JWT_ISSUER: librechat
      CODEAPI_JWT_AUDIENCE: codeapi
      CODEAPI_JWT_ALLOWED_ALGS: EdDSA
      SERVICE_PORT: "3112"
      SANDBOX_ENDPOINT: http://codeapi-sandbox:2000/api/v2
      EGRESS_GATEWAY_URL: http://codeapi-egress-gateway:3190
      FILE_SERVER_URL: http://codeapi-file-server:3000
      TOOL_CALL_SERVER_URL: http://codeapi-tool-call-server:3033
      CODEAPI_INTERNAL_SERVICE_TOKEN: ${CODEAPI_INTERNAL_SERVICE_TOKEN}
      REDIS_HOST: codeapi-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${CODEAPI_REDIS_PASSWORD}
    depends_on:
      codeapi-redis:
        condition: service_healthy
      codeapi-tool-call-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:3112/v1/health')\" || node -e \"require('http').get('http://localhost:3112/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  codeapi-worker:
    build:
      context: ./codeapi
      dockerfile: service/Dockerfile
      target: worker
    environment:
      LOCAL_MODE: "false"
      CODEAPI_HARDENED_SANDBOX_MODE: "true"
      CODEAPI_AUTH_PROVIDER: librechat-jwt
      # Signs a per-job execution manifest (base64 DER — NOT the JWT PEM pair above;
      # the two encodings are not interchangeable, execution-manifest.ts base64-decodes
      # before createPrivateKey). codeapi-sandbox verifies with the public half only —
      # it never receives this private key.
      CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY: ${CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY}
      SANDBOX_ENDPOINT: http://codeapi-sandbox:2000/api/v2
      EGRESS_GATEWAY_URL: http://codeapi-egress-gateway:3190
      CODEAPI_INTERNAL_SERVICE_TOKEN: ${CODEAPI_INTERNAL_SERVICE_TOKEN}
      REDIS_HOST: codeapi-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${CODEAPI_REDIS_PASSWORD}
      PYTHON_CONCURRENCY: "1"
      OTHER_CONCURRENCY: "4"
      WORKER_HEALTH_PORT: "3113"
    depends_on:
      codeapi-redis:
        condition: service_healthy
      codeapi-sandbox:
        condition: service_healthy
    restart: unless-stopped

  codeapi-file-server:
    build:
      context: ./codeapi
      dockerfile: service/Dockerfile
      target: production
    environment:
      MINIO_BUCKET: codeapi-sessions
      MINIO_ENDPOINT: codeapi-minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FILE_SERVER_PORT: "3000"
      REDIS_HOST: codeapi-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${CODEAPI_REDIS_PASSWORD}
      CODEAPI_INTERNAL_SERVICE_TOKEN: ${CODEAPI_INTERNAL_SERVICE_TOKEN}
    depends_on:
      codeapi-redis:
        condition: service_healthy
      codeapi-minio:
        condition: service_healthy
    restart: unless-stopped

  codeapi-tool-call-server:
    build:
      context: ./codeapi
      dockerfile: service/Dockerfile.tool-call-server
      target: production
    environment:
      TOOL_CALL_SERVER_PORT: "3033"
      TOOL_CALL_REQUEST_TIMEOUT: "300000"
      TOOL_CALL_SESSION_EXPIRY: "600"
      REDIS_HOST: codeapi-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${CODEAPI_REDIS_PASSWORD}
      CODEAPI_INTERNAL_SERVICE_TOKEN: ${CODEAPI_INTERNAL_SERVICE_TOKEN}
    depends_on:
      codeapi-redis:
        condition: service_healthy
    restart: unless-stopped

  codeapi-egress-gateway:
    build:
      context: ./codeapi
      dockerfile: service/Dockerfile.egress-gateway
      target: production
    environment:
      SERVICE_NAME: egress-gateway
      CODEAPI_HARDENED_SANDBOX_MODE: "true"
      CODEAPI_EGRESS_LEDGER_REQUIRED: "true"
      EGRESS_GATEWAY_PORT: "3190"
      EGRESS_GATEWAY_FILE_SERVER_URL: http://codeapi-file-server:3000
      EGRESS_GATEWAY_TOOL_CALL_SERVER_URL: http://codeapi-tool-call-server:3033
      EGRESS_GATEWAY_MAX_TOOL_CALL_BYTES: "1048576"
      CODEAPI_EGRESS_GRANT_SECRET: ${CODEAPI_EGRESS_GRANT_SECRET}
      CODEAPI_INTERNAL_SERVICE_TOKEN: ${CODEAPI_INTERNAL_SERVICE_TOKEN}
      REDIS_HOST: codeapi-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${CODEAPI_REDIS_PASSWORD}
    depends_on:
      codeapi-redis:
        condition: service_healthy
      codeapi-file-server:
        condition: service_started
      codeapi-tool-call-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3190/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Direct NsJail sandbox — target `sandbox-build` (api/Dockerfile), NOT the
  # `sandbox-runner-*` family (that chain builds the Fedora + Rust + libkrun launcher and
  # the ext4 guest rootfs for the microVM path this deployment deliberately does not
  # build). The capability list and seccomp profile mirror the codeapi project's own
  # docker-compose.mac.yml, which is upstream's OWN reference for running this same
  # target without /dev/kvm — the closest thing to a validated NsJail-direct recipe that
  # ships with the vendored source, rather than a configuration invented here from Docker
  # capability documentation alone.
  codeapi-sandbox:
    build:
      context: ./codeapi
      dockerfile: api/Dockerfile
      target: sandbox-build
    entrypoint: ["/sandbox_api/entrypoint.sh"]
    # NsJail's cgroupv2 delegation needs the HOST cgroup namespace, not the private one
    # Docker gives a container by default — without this it fails
    # enableCgroupSubtree() at the very first job with "nsjail MUST be run from root and
    # the cgroup mount path must refer to the root/host cgroup", which reads like a
    # privilege problem but is actually just this one setting. Measured by actually
    # running it, not inferred from upstream's docker-compose.mac.yml (Docker Desktop's
    # VM does not need this the same way a native Linux host does).
    cgroup: host
    security_opt:
      - seccomp=./codeapi/seccomp/nsjail.json
      # Docker's default AppArmor profile (docker-default) has an unconditional `deny
      # mount,` rule that overrides Linux capabilities outright — SYS_ADMIN grants the
      # capability, AppArmor still vetoes the syscall, and nsjail failed at
      # buildMountTree() with a bare "Permission denied" that reads like a missing
      # capability rather than a second, independent confinement layer. NsJail's own
      # restrictive syscall whitelist (the seccomp profile above) is this container's
      # confinement instead of the host's generic profile, which is not written for a
      # process whose whole job is namespaces and mounts.
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - SETUID
      - SETGID
      - NET_ADMIN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - CHOWN
      - FOWNER
      - FSETID
      - KILL
      - SETFCAP
      - MKNOD
    volumes:
      - codeapipkgs:/pkgs:ro
    environment:
      KVM_ENABLED: "false"
      CODEAPI_HARDENED_SANDBOX_MODE: "true"
      # Docker mounts /sys/fs/cgroup read-only inside a non-privileged container even
      # with `cgroup: host` above (which fixes the namespace, not the mount mode), so
      # NsJail's own cgroup v2 delegation (creating a subtree per job) fails with
      # "Read-only file system" rather than a permissions error. Upstream's OWN
      # docker-compose.mac.yml sets exactly this to false for its direct-NsJail path —
      # not a workaround invented here. Isolation cost, stated plainly: per-job
      # memory/pids cgroup LIMITS are not enforced; namespaces (PID/mount/net/user),
      # seccomp, and the egress gateway in front of all sandbox traffic still are.
      SANDBOX_USE_CGROUPV2: "false"
      EGRESS_GATEWAY_URL: http://codeapi-egress-gateway:3190
      SANDBOX_PACKAGES_DIRECTORY: /pkgs
      SANDBOX_LOG_LEVEL: INFO
      SANDBOX_OUTPUT_MAX_SIZE: "65536"
      SANDBOX_MAX_CONCURRENT_JOBS: "4"
      SANDBOX_PER_JOB_UIDS: "true"
      SANDBOX_JOB_UID_BASE: "200000"
      SANDBOX_JOB_GID_BASE: "200000"
      SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS: "3600"
      SANDBOX_RUN_TIMEOUT: "300000"
      SANDBOX_RUN_CPU_TIME: "60000"
      SANDBOX_COMPILE_TIMEOUT: "30000"
      SANDBOX_ALLOWED_LOCAL_NETWORK_PORT: "3190"
      SANDBOX_FORWARD_TARGET: codeapi-egress-gateway:3190
      SANDBOX_REQUIRE_EGRESS_MANIFEST: "true"
      # Verifies the worker's per-job manifest (base64 DER public half). The private
      # half above never reaches this container — secure-startup.ts's hardened-mode
      # boot check would refuse to start if it could see it (any CODEAPI_*/REDIS_*/
      # AWS_*/S3_*/MINIO_* var, or anything matching SECRET|TOKEN|PASSWORD|PRIVATE_KEY).
      SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY: ${SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY}
    depends_on:
      codeapi-egress-gateway:
        condition: service_healthy
      codeapi-package-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:2000/api/v2/runtimes').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  # One-shot job: populates the /pkgs volume (Python/Node/Bun/Bash runtimes for NsJail)
  # before codeapi-sandbox starts. Runs once; `docker compose up` re-runs it but
  # package-init.sh no-ops when the marker file shows the tree is already current.
  codeapi-package-init:
    build:
      context: ./codeapi
      dockerfile: docker/Dockerfile.package-init
    volumes:
      - codeapipkgs:/pkgs
    restart: "no"

  chat:
    # v0.8.7 (2026-06-24), not v0.8.0. Agent Skills and subagents shipped in v0.8.6 and
    # the self-hosted Apache-2.0 code interpreter in v0.8.7, so three p0 features were
    # blocked on a version rather than on a design (enterpriseaiframework-f50).
    #
    # THE PIN AND bundle/librechat/librechat.yaml MOVE TOGETHER. LibreChat validates the
    # config with `configSchema.strict().safeParse`, and the two versions disagree about
    # what happens when that fails:
    #   v0.8.0 (api/server/services/Config/loadCustomConfig.js) logs and `return null` —
    #     the surface comes up with NO custom config at all: no gateway endpoint, no
    #     modelSpecs, no memory, no MCP servers. It looks healthy and answers /health 200.
    #   v0.8.7 logs and `process.exit(1)` unless CONFIG_BYPASS_VALIDATION=true.
    # So a config carrying a v0.8.7-only key, deployed against a v0.8.0 image, is the
    # silent-misconfiguration failure this item was written to avoid. tests/
    # test_chat_surface_version.py pins compose and deploy/k8s/50-chat.yaml to the same
    # tag so the two deployments cannot drift apart again (rd 634).
    image: ghcr.io/danny-avila/librechat:v0.8.7
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://chatdb:27017/librechat
      DOMAIN_CLIENT: http://localhost:${CHAT_PORT:-3080}
      DOMAIN_SERVER: http://localhost:${CHAT_PORT:-3080}
      CONFIG_PATH: /app/librechat.yaml

      # One control plane. Without this the surface also offers openAI, anthropic,
      # google, azure and bedrock endpoints that talk to providers directly — a path
      # around the gateway with no metering, no budget and no audit trail. Restricting
      # this list leaves exactly one way out of the building.
      #
      # custom,agents — NOT just "custom". The list is literal, and naming only "custom"
      # also drops the AGENTS endpoint, which is where MCP servers, memory, tools, file
      # search and web search live. That was found on the cluster: closing the provider
      # bypass silently took the entire agents framework with it. The bundle kept the
      # narrower value for weeks afterwards, so anything exercised here was testing a
      # different surface from the one deployed.
      ENDPOINTS: custom,agents

      CREDS_KEY: ${CHAT_CREDS_KEY:?set CHAT_CREDS_KEY in .env}
      CREDS_IV: ${CHAT_CREDS_IV:?set CHAT_CREDS_IV in .env}
      JWT_SECRET: ${CHAT_JWT_SECRET:?set CHAT_JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${CHAT_JWT_REFRESH_SECRET:?set CHAT_JWT_REFRESH_SECRET in .env}

      # One login: the chat surface holds no user table and no password. Local
      # registration and email login are off, so Keycloak is the only way in.
      ALLOW_EMAIL_LOGIN: "false"
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"

      # Same URL the browser uses, which is what makes issuer validation pass.
      OPENID_ISSUER: https://${IDP_PUBLIC_HOST}:${IDP_HTTPS_PORT:-8443}/realms/${IDP_REALM:-enterprise-ai}
      # Trust the bundle's self-signed identity certificate. Scoped to this CA only —
      # not a blanket disable of certificate verification.
      NODE_EXTRA_CA_CERTS: /certs/identity.crt
      OPENID_CLIENT_ID: librechat
      OPENID_CLIENT_SECRET: ${CHAT_CLIENT_SECRET}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_SCOPE: "openid profile email"
      OPENID_SESSION_SECRET: ${CHAT_SESSION_SECRET:?set CHAT_SESSION_SECRET in .env}
      OPENID_BUTTON_LABEL: "Sign in with Enterprise AI"
      OPENID_AUTO_REDIRECT: "false"

      # Login throttling defaults to 7 attempts per 5 minutes, which the test suite trips
      # immediately. Raised for the bundle; a production deployment should lower it back.
      LOGIN_MAX: ${CHAT_LOGIN_MAX:-100}
      LOGIN_WINDOW: ${CHAT_LOGIN_WINDOW:-1}
      BAN_VIOLATIONS: "false"

      # The surface never holds a provider key — only its virtual key.
      CHAT_VIRTUAL_KEY: ${CHAT_VIRTUAL_KEY:-}

      # enterpriseaiframework-6ff: the tenant's Agent Skills corpus. A DIFFERENT
      # mechanism from librechat.yaml's `skills` capability flag — this is the
      # filesystem loader (packages/api/src/skills/deployment.ts,
      # initializeDeploymentSkills), scanned ONCE at boot into a module-level
      # singleton, NOT persisted as Mongo Skill documents. Two consequences worth
      # restating here rather than only in dogfood-findings.md finding 41:
      #   - Editing ./skills requires restarting this container; there is no
      #     watcher. `docker compose restart chat` after any change.
      #   - A malformed SKILL.md throws at boot and takes the whole surface down
      #     (the awaited call in api/server/index.js is unguarded). We do not
      #     patch LibreChat to guard that await — "integrate, do not reimplement"
      #     forbids carrying a fork of the image. Instead this is guarded ON OUR
      #     SIDE: tests/test_skill_corpus.py boots this exact container with this
      #     exact ./skills directory and asserts /health before any turn is sent,
      #     so malformed tenant content fails `make test` (a disposable bundle,
      #     not a shared deployment) before anyone pushes it toward the cluster's
      #     chat-skills ConfigMap (deploy/k8s/50-chat.yaml).
      DEPLOYMENT_SKILLS_DIR: /app/skill

      # Code execution (enterpriseaiframework-082). LIBRECHAT_CODE_API_KEY is
      # DELIBERATELY ABSENT — it does not exist in v0.8.7 (nothing under /app in the
      # pinned image reads it) and setting it configures nothing while looking like
      # auth. The real credential is CODEAPI_AUTH_PROVIDER=librechat-jwt, which turns on
      # packages/api/src/auth/codeapi.ts's per-request JWT minting: a <=300s EdDSA token
      # whose `sub` is the AUTHENTICATED user, signed with the private half below.
      LIBRECHAT_CODE_BASEURL: http://codeapi:3112/v1
      CODEAPI_AUTH_PROVIDER: librechat-jwt
      CODEAPI_JWT_PRIVATE_KEY: ${CODEAPI_JWT_PRIVATE_KEY}
      CODEAPI_JWT_KID: lc-codeapi-bundle-1
      CODEAPI_JWT_ISSUER: librechat
      CODEAPI_JWT_AUDIENCE: codeapi
      # ---- web search (enterpriseaiframework-0be) --------------------------------
      #
      # These MUST be supplied as environment variables and librechat.yaml MUST reference
      # them as ${...} placeholders. That is not style — it is load bearing. LibreChat
      # resolves web-search credentials by extracting an env-var NAME out of each config
      # value (packages/api extractWebSearchEnvVars -> extractVariableName). A literal
      # value written directly in librechat.yaml yields no variable name, so the field is
      # counted as missing, `requiredAuthFields.length !== requiredKeys.length` skips the
      # provider, and the search provider silently falls back to the default (serper) with
      # no key. Symptom: web_search offered in the UI and every call failing.
      SEARXNG_INSTANCE_URL: http://searxng:8080
      # Scraper leg. `firecrawl` is the WIRE SHAPE, not the vendor — webfetch speaks
      # Firecrawl's /v2/scrape contract so LibreChat's existing client can be pointed at
      # it unmodified. Swapping to real Firecrawl (cloud or self-hosted) is these two
      # values and nothing else.
      FIRECRAWL_API_URL: http://webfetch:3002
      FIRECRAWL_API_KEY: ${WEBFETCH_TOKEN:?set WEBFETCH_TOKEN in .env}
      # Rerank leg. `jina` names the WIRE CONTRACT, not the vendor — rerank/ speaks
      # Jina's own /v1/rerank shape so LibreChat's existing JinaReranker client works
      # unmodified. The FULL path is required: the client POSTs jinaApiUrl verbatim and
      # appends nothing. Swapping to a real Jina/Cohere key is these two values.
      JINA_API_URL: http://rerank:3003/v1/rerank
      JINA_API_KEY: ${RERANK_TOKEN:?set RERANK_TOKEN in .env}
      # ---- conversation search (enterpriseaiframework-2a6) ------------------------
      # LibreChat's own native feature (see the meilisearch service comment above).
      # SEARCH=true turns on both api/server/routes/search.js's /enable check and the
      # mongoMeili plugin's real-time index-on-save for every Message and
      # Conversation document. MEILI_MASTER_KEY is never presented to the browser —
      # it stays server-side, between chat and meilisearch.
      SEARCH: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_SYNC: "false"
      # File search (enterpriseaiframework-c7c). Unset, this is exactly the
      # "RAG API is either not running or not reachable at undefined" warning the item
      # started from — LibreChat's file_search tool silently has nowhere to embed or
      # query uploaded documents. Ours: storage and retrieval are both on this compose
      # network (bundle/docker-compose.yml's `ragvector` + `rag-api`), no hosted
      # third-party vector service in the data path.
      RAG_API_URL: http://rag-api:8000
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - ./certs:/certs:ro
      # Tenant content, not platform content (same principle as workspace house
      # rules, enterpriseaiframework-cbf): a camp's skills and a law firm's
      # skills are different directories on this one mechanism, so this lives in
      # the bundle, never in the LibreChat image. Read-only — this deployment
      # does not author skills through the UI.
      - ./skills:/app/skill:ro
    ports:
      - "${CHAT_PORT:-3080}:3080"
    depends_on:
      chatdb:
        condition: service_healthy
      identity:
        condition: service_healthy
      gateway:
        condition: service_healthy
      mcp-echo:
        condition: service_healthy
      codeapi:
        condition: service_healthy
      # Gates startup: search silently returning nothing (a healthy-looking chat
      # surface whose meiliSearch calls always 5xx) is exactly the failure mode this
      # item exists to close, so meilisearch being up is a precondition, same as
      # webfetch/rerank below.
      meilisearch:
        condition: service_healthy
      # webfetch and rerank both gate startup: without either, web_search either fetches
      # nothing (no scraper key) or fetches and then withholds it from the model (no
      # working reranker), and grounding is exactly enterpriseaiframework-0be's outcome.
      # SearXNG does NOT gate startup — its healthcheck runs a real outbound query, so
      # gating chat on it would make the whole bundle's startup depend on the public
      # internet answering, and `make up` must work on a host that cannot reach bing. A
      # degraded search leg is a degraded feature; it is not a reason for chat to be down.
      webfetch:
        condition: service_healthy
      rerank:
        condition: service_healthy
      # Same reasoning as webfetch/rerank above: rag-api is entirely ours, on this
      # network, with no external dependency, so an unreachable RAG API is a real
      # failure to surface at startup rather than a degraded-but-tolerable leg.
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  chatdbdata:
  meilidata:
  ragvectordata:
  codeapiredisdata:
  codeapiminiodata:
  codeapipkgs:
