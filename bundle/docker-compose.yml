# The reference bundle: one command, one host, no GPU (scope item 8).
#
# Defaults are wired to the fake provider so this comes up and is testable end to end
# with no provider account and no spend. Point the gateway at real upstreams by editing
# litellm/config.yaml and setting the provider keys in .env — nothing else changes.

# A worktree checkout gets its own project name and its own port block, rendered into
# .env by bin/render-env.sh (enterpriseaiframework-0e3) — otherwise every worktree's
# `docker compose up/down` would operate on the SAME containers as the primary checkout.
name: ${COMPOSE_PROJECT_NAME:-enterprise-ai}

x-postgres-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-eai}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *pg-env
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: identity,gateway,controlplane
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eai} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  fakeprovider:
    build: ../fakeprovider
    # Published so the exit-path test can reach "the provider" directly, the way a
    # surface would once the layer is removed. A real provider is on the internet;
    # this stands in for that reachability.
    ports:
      - "${FAKEPROVIDER_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.4
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IDP_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDP_ADMIN_PASSWORD:?set IDP_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identity
      KC_DB_USERNAME: ${POSTGRES_USER:-eai}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # One issuer URL for everyone — the host's own IP, which the browser reaches
      # directly and containers reach because published ports bind on the host.
      # Backchannel-dynamic is deliberately NOT used: it
      # makes the discovery document report a different issuer than the one the client
      # requested, and the OIDC client rejects that mismatch outright.
      KC_HOSTNAME: https://${IDP_PUBLIC_HOST}:${IDP_HTTPS_PORT:-8443}
      # TLS is required by the chat surface's OIDC client, which refuses plaintext
      # discovery. Plain HTTP stays available on 8080 for control-plane admin calls
      # inside the compose network.
      KC_HTTPS_CERTIFICATE_FILE: /certs/identity.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/identity.key
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ./certs:/certs:ro
    ports:
      - "${IDP_PORT:-8082}:8080"
      - "${IDP_HTTPS_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Probe the realm endpoint over plain HTTP on 8080. The management/health port
      # switches to HTTPS as soon as a certificate is configured, so a plaintext probe
      # against 9000 reports unhealthy on a server that is working fine. The JVM image
      # has no curl, hence bash's /dev/tcp. Hitting the realm also proves the import
      # landed, which a liveness probe would not.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/${IDP_REALM:-enterprise-ai} HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  gateway:
    image: ghcr.io/berriai/litellm:main-v1.77.3-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${GATEWAY_SALT_KEY:?set GATEWAY_SALT_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-eai}:${POSTGRES_PASSWORD}@postgres:5432/gateway
      REDIS_URL: redis://valkey:6379
      # Real upstreams go here. Unset in the default bundle — the fake provider needs none.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Forge agent key. Runtime inference only — it can spend, not mint keys. The
      # admin key deliberately never reaches a container.
      FORGE_API_KEY: ${FORGE_API_KEY:-}
    volumes:
      - ./litellm/config.generated.yaml:/app/config.yaml:ro
      # The callback module config.yaml names. litellm imports it by bare module name from
      # the working directory, so it has to sit next to config.yaml — without it the proxy
      # raises ImportError at startup and crash-loops. Same file the cluster mounts.
      - ../deploy/gateway/strip_reasoning.py:/app/strip_reasoning.py:ro
      - ../deploy/gateway/require_principal.py:/app/require_principal.py:ro
      - ../deploy/gateway/flush_spend_on_shutdown.py:/app/flush_spend_on_shutdown.py:ro
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      fakeprovider:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  control-plane:
    build: ../control-plane
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql://${POSTGRES_USER:-eai}:${POSTGRES_PASSWORD}@postgres:5432/controlplane
      GATEWAY_DATABASE_URL: postgresql://${POSTGRES_USER:-eai}:${POSTGRES_PASSWORD}@postgres:5432/gateway
      GATEWAY_URL: http://gateway:4000
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY}
      IDP_URL: http://identity:8080
      IDP_REALM: ${IDP_REALM:-enterprise-ai}
      IDP_CLIENT_ID: control-plane
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET:?set IDP_CLIENT_SECRET in .env}
      CONTROL_PLANE_ADMIN_TOKEN: ${CONTROL_PLANE_ADMIN_TOKEN:?set CONTROL_PLANE_ADMIN_TOKEN in .env}
    ports:
      - "${CONTROL_PLANE_PORT:-8081}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
      identity:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # LibreChat's own store. Mongo is LibreChat's requirement, not ours — it holds
  # conversations, not control-plane state. Postgres stays welded for everything that is
  # ours (ledger, audit, principals).
  # The trivial MCP server (enterpriseaiframework-12b), mirrored here so the compose
  # bundle and the cluster (deploy/k8s/06-mcp-echo.yaml) do not diverge: librechat.yaml
  # is the one file both environments mount, and LibreChat tries to connect every
  # configured mcpServers entry at startup regardless of whether ENDPOINTS includes
  # `agents` — an mcpServers entry with no matching compose service would leave `chat`
  # trying to resolve a hostname that does not exist in this network.
  mcp-echo:
    build: ../mcp-echo
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  chatdb:
    image: mongo:7
    command: ["--quiet"]
    volumes:
      - chatdbdata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  chat:
    # v0.8.7 (2026-06-24), not v0.8.0. Agent Skills and subagents shipped in v0.8.6 and
    # the self-hosted Apache-2.0 code interpreter in v0.8.7, so three p0 features were
    # blocked on a version rather than on a design (enterpriseaiframework-f50).
    #
    # THE PIN AND bundle/librechat/librechat.yaml MOVE TOGETHER. LibreChat validates the
    # config with `configSchema.strict().safeParse`, and the two versions disagree about
    # what happens when that fails:
    #   v0.8.0 (api/server/services/Config/loadCustomConfig.js) logs and `return null` —
    #     the surface comes up with NO custom config at all: no gateway endpoint, no
    #     modelSpecs, no memory, no MCP servers. It looks healthy and answers /health 200.
    #   v0.8.7 logs and `process.exit(1)` unless CONFIG_BYPASS_VALIDATION=true.
    # So a config carrying a v0.8.7-only key, deployed against a v0.8.0 image, is the
    # silent-misconfiguration failure this item was written to avoid. tests/
    # test_chat_surface_version.py pins compose and deploy/k8s/50-chat.yaml to the same
    # tag so the two deployments cannot drift apart again (rd 634).
    image: ghcr.io/danny-avila/librechat:v0.8.7
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://chatdb:27017/librechat
      DOMAIN_CLIENT: http://localhost:${CHAT_PORT:-3080}
      DOMAIN_SERVER: http://localhost:${CHAT_PORT:-3080}
      CONFIG_PATH: /app/librechat.yaml

      # One control plane. Without this the surface also offers openAI, anthropic,
      # google, azure and bedrock endpoints that talk to providers directly — a path
      # around the gateway with no metering, no budget and no audit trail. Restricting
      # this list leaves exactly one way out of the building.
      #
      # custom,agents — NOT just "custom". The list is literal, and naming only "custom"
      # also drops the AGENTS endpoint, which is where MCP servers, memory, tools, file
      # search and web search live. That was found on the cluster: closing the provider
      # bypass silently took the entire agents framework with it. The bundle kept the
      # narrower value for weeks afterwards, so anything exercised here was testing a
      # different surface from the one deployed.
      ENDPOINTS: custom,agents

      CREDS_KEY: ${CHAT_CREDS_KEY:?set CHAT_CREDS_KEY in .env}
      CREDS_IV: ${CHAT_CREDS_IV:?set CHAT_CREDS_IV in .env}
      JWT_SECRET: ${CHAT_JWT_SECRET:?set CHAT_JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${CHAT_JWT_REFRESH_SECRET:?set CHAT_JWT_REFRESH_SECRET in .env}

      # One login: the chat surface holds no user table and no password. Local
      # registration and email login are off, so Keycloak is the only way in.
      ALLOW_EMAIL_LOGIN: "false"
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"

      # Same URL the browser uses, which is what makes issuer validation pass.
      OPENID_ISSUER: https://${IDP_PUBLIC_HOST}:${IDP_HTTPS_PORT:-8443}/realms/${IDP_REALM:-enterprise-ai}
      # Trust the bundle's self-signed identity certificate. Scoped to this CA only —
      # not a blanket disable of certificate verification.
      NODE_EXTRA_CA_CERTS: /certs/identity.crt
      OPENID_CLIENT_ID: librechat
      OPENID_CLIENT_SECRET: ${CHAT_CLIENT_SECRET}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_SCOPE: "openid profile email"
      OPENID_SESSION_SECRET: ${CHAT_SESSION_SECRET:?set CHAT_SESSION_SECRET in .env}
      OPENID_BUTTON_LABEL: "Sign in with Enterprise AI"
      OPENID_AUTO_REDIRECT: "false"

      # Login throttling defaults to 7 attempts per 5 minutes, which the test suite trips
      # immediately. Raised for the bundle; a production deployment should lower it back.
      LOGIN_MAX: ${CHAT_LOGIN_MAX:-100}
      LOGIN_WINDOW: ${CHAT_LOGIN_WINDOW:-1}
      BAN_VIOLATIONS: "false"

      # The surface never holds a provider key — only its virtual key.
      CHAT_VIRTUAL_KEY: ${CHAT_VIRTUAL_KEY:-}
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - ./certs:/certs:ro
    ports:
      - "${CHAT_PORT:-3080}:3080"
    depends_on:
      chatdb:
        condition: service_healthy
      identity:
        condition: service_healthy
      gateway:
        condition: service_healthy
      mcp-echo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  chatdbdata:
