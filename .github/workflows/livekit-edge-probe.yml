# External vantage point for the LiveKit exposure rulings (gate cfa, items 7f6/4d2/82e):
# LiveKit MEDIA and every LiveKit port must NOT be reachable from the public edge, and the ONE
# public piece, /rtc signalling (BARON RULING 2026-09-30), must demand authentication (302 to
# oauth2-proxy sign-in, or 401/403) with no session: never absent, never reaching LiveKit. GitHub-hosted runners
# sit outside the LAN/VPN. BARON RULING 2026-09-30: ai.3dl.one is not guaranteed LAN-only, and
# public DNS answers a private IP for it, so probing the NAME alone is trivially true. This
# job also probes the site's real WAN IP (Actions variable EDGE_WAN_IP, or the dispatch input;
# discover with `ssh gateway.stealth.baron.local curl -s https://ifconfig.me`). It is fail-closed:
# no WAN IP configured = red. The schedule is active once this file is on the default branch, so a
# future public exposure turns the daily run red. The static exposure checker
# (control-plane/tests/test_livekit_tokens.py) remains the primary guarantee.
name: livekit-edge-probe
on:
  workflow_dispatch:
    inputs:
      host:
        description: public hostname to probe
        default: ai.3dl.one
      wan_ip:
        description: site WAN IP (defaults to the EDGE_WAN_IP repo variable)
        default: ""
  push:
    paths:
      - .github/workflows/livekit-edge-probe.yml
      - tests-live/test_livekit_exposure.py
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest httpx
      - name: probe the hostname and the WAN IP from outside
        env:
          HOST: ${{ github.event.inputs.host || 'ai.3dl.one' }}
          WAN_IP: ${{ github.event.inputs.wan_ip || vars.EDGE_WAN_IP }}
        run: |
          if [ -z "$WAN_IP" ]; then
            echo "::error::EDGE_WAN_IP is not set: without the real WAN IP this probe only tests private DNS (Baron ruling 2026-09-30)"
            exit 1
          fi
          ip=$(dig +short "$HOST" A | grep -E '^[0-9.]+$' | head -1)
          echo "runner egress: $(curl -s https://api.ipify.org)  $HOST -> ${ip:-<none>}  (WAN IP configured)"
          hosts="$HOST,$WAN_IP"; [ -n "$ip" ] && hosts="$hosts,$ip"
          # Positive controls: github.com:443 connects (and refuses :7880 through the same probe),
          # a public STUN server answers the same UDP datagram. Nothing public is served by the
          # site itself today, so github.com is the reachability control (Baron: do not expose
          # anything to manufacture one).
          # The WAN IP must answer https /rtc: an unreachable required target FAILS (it verified
          # nothing). Other targets that do not answer are reported as UNREACHABLE skips (-rs).
          EDGE_CONTROL_HOST=github.com EDGE_SNI="$HOST" EDGE_HOST="$hosts" EDGE_REQUIRE_REACHABLE="$WAN_IP" \
            pytest tests-live/test_livekit_exposure.py -v -rs -p no:cacheprovider
