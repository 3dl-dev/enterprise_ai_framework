# External vantage point for the LiveKit exposure ruling (gate cfa, items 7f6/4d2):
# LiveKit signalling/media must NOT be reachable from the public edge. GitHub-hosted runners
# sit outside the LAN/VPN, so this is the probe from outside. Run on demand or daily.
name: livekit-edge-probe
on:
  workflow_dispatch:
    inputs:
      host:
        description: public hostname to probe
        default: ai.3dl.one
  push:
    paths:
      - .github/workflows/livekit-edge-probe.yml
      - tests-live/test_livekit_exposure.py
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest httpx
      - name: probe from outside
        env:
          HOST: ${{ github.event.inputs.host || 'gateway.tailcb6ef9.ts.net' }}
        run: |
          # ai.3dl.one is a LAN name (public DNS answers 192.168.2.45); the internet-facing
          # origin is the Tailscale Funnel name, whose :443 is the positive control.
          fip=$(dig +short "$HOST" A | grep -E '^[0-9.]+$' | head -1)
          echo "runner egress: $(curl -s https://api.ipify.org)  $HOST -> ${fip:-<none>}  ai.3dl.one -> $(dig +short ai.3dl.one A)"
          EDGE_CONTROL_HOST="$HOST" EDGE_HOST="$HOST,$fip,ai.3dl.one" \
            pytest tests-live/test_livekit_exposure.py -v -p no:cacheprovider
