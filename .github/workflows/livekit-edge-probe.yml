# External vantage point for the LiveKit exposure ruling (gate cfa, items 7f6/4d2):
# LiveKit signalling/media must NOT be reachable from the public edge. GitHub-hosted runners
# sit outside the LAN/VPN. The site hostname is not guaranteed LAN-only, and public DNS may
# answer a private IP for it, so probing the NAME alone is trivially true. This
# job also probes the site's real WAN IP (Actions variable EDGE_WAN_IP, or the dispatch input;
# discover it with `curl -s https://ifconfig.me` from a host on the site network). The edge
# hostname comes from the Actions variable EDGE_HOST (or the dispatch input). Fail-closed:
# no host or no WAN IP configured = red. The schedule is active once this file is on the default branch, so a
# future public exposure turns the daily run red. The static exposure checker
# (control-plane/tests/test_livekit_tokens.py) remains the primary guarantee.
name: livekit-edge-probe
on:
  workflow_dispatch:
    inputs:
      host:
        description: public hostname to probe (defaults to the EDGE_HOST repo variable)
        default: ""
      wan_ip:
        description: site WAN IP (defaults to the EDGE_WAN_IP repo variable)
        default: ""
  push:
    paths:
      - .github/workflows/livekit-edge-probe.yml
      - tests-live/test_livekit_exposure.py
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest httpx
      - name: probe the hostname and the WAN IP from outside
        env:
          HOST: ${{ github.event.inputs.host || vars.EDGE_HOST }}
          WAN_IP: ${{ github.event.inputs.wan_ip || vars.EDGE_WAN_IP }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::EDGE_HOST is not set: set the EDGE_HOST Actions variable to the public hostname"
            exit 1
          fi
          if [ -z "$WAN_IP" ]; then
            echo "::error::EDGE_WAN_IP is not set: without the real WAN IP this probe only tests private DNS"
            exit 1
          fi
          ip=$(dig +short "$HOST" A | grep -E '^[0-9.]+$' | head -1)
          echo "runner egress: $(curl -s https://api.ipify.org)  $HOST -> ${ip:-<none>}  (WAN IP configured)"
          hosts="$HOST,$WAN_IP"; [ -n "$ip" ] && hosts="$hosts,$ip"
          # Positive controls: github.com:443 connects (and refuses :7880 through the same probe),
          # a public STUN server answers the same UDP datagram. Nothing public is served by the
          # site itself today, so github.com is the reachability control (do not expose
          # anything to manufacture one).
          # The WAN IP must answer https /rtc: an unreachable required target FAILS (it verified
          # nothing). Other targets that do not answer are reported as UNREACHABLE skips (-rs).
          EDGE_CONTROL_HOST=github.com EDGE_SNI="$HOST" EDGE_HOST="$hosts" EDGE_REQUIRE_REACHABLE="$WAN_IP" \
            pytest tests-live/test_livekit_exposure.py -v -rs -p no:cacheprovider
