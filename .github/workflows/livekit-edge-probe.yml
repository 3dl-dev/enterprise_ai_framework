# External vantage point for the LiveKit exposure ruling (gate cfa, items 7f6/4d2):
# LiveKit signalling/media must NOT be reachable from the public edge. GitHub-hosted runners
# sit outside the LAN/VPN, so this is the probe from outside. Run on demand or daily.
name: livekit-edge-probe
on:
  workflow_dispatch:
    inputs:
      host:
        description: public hostname to probe
        default: ai.3dl.one
  push:
    paths:
      - .github/workflows/livekit-edge-probe.yml
      - tests-live/test_livekit_exposure.py
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest httpx
      - name: probe from outside
        env:
          HOST: ${{ github.event.inputs.host || 'ai.3dl.one' }}
        run: |
          # As of 2026-09-29 public DNS answers 192.168.2.45 for ai.3dl.one and tailscaled (the
          # Funnel) is stopped on the gateway, so there is no public origin. The probe still runs
          # against whatever $HOST resolves to; it becomes a stronger check the day a public
          # origin exists. EDGE_CONTROL_HOST=github.com proves this runner can make outbound TCP
          # connects and that the probe tells "connected" from "refused/filtered".
          ip=$(dig +short "$HOST" A | grep -E '^[0-9.]+$' | head -1)
          echo "runner egress: $(curl -s https://api.ipify.org)  $HOST -> ${ip:-<none>}"
          hosts="$HOST"; [ -n "$ip" ] && [ "$ip" != "$HOST" ] && hosts="$HOST,$ip"
          EDGE_CONTROL_HOST=github.com EDGE_HOST="$hosts" \
            pytest tests-live/test_livekit_exposure.py -v -p no:cacheprovider
