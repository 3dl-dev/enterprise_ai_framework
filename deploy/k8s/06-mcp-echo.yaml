# The trivial MCP server (enterpriseaiframework-12b).
#
# Proves the MCP wiring ONCE with the smallest possible server before web-search, skills
# and code-execution are built as real MCP servers on top of the same path. A single
# tool, `echo`, that returns a value the model could not produce on its own
# (`ECHO:<input>`), so a test can tell "the tool actually ran" apart from "the model
# guessed the shape of a reply."
#
# Speaks MCP over streamable-http, registered in bundle/librechat/librechat.yaml under
# `mcpServers.echo` as a URL — LibreChat calls it as a network peer, not a subprocess it
# has to spawn inside its own container.
#
# `image: REPLACED_BY_DEPLOY` is substituted at apply time (no automated deploy script
# owns this yet, matching 05-fakeprovider.yaml's manual-substitution convention). Built
# with kaniko per mcp-echo/kaniko-job.yaml (no Docker socket, no privileged container).
# Currently live: 192.168.2.43:30500/enterprise-ai-mcp-echo:12b2
apiVersion: v1
kind: Service
metadata:
  name: mcp-echo
  namespace: enterprise-ai
spec:
  selector: { app: mcp-echo }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-echo
  namespace: enterprise-ai
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-echo } }
  template:
    metadata:
      labels: { app: mcp-echo }
    spec:
      containers:
        - name: mcp-echo
          image: REPLACED_BY_DEPLOY
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { memory: "128Mi" }
