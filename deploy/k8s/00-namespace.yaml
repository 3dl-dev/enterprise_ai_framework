# Everything this tenant owns lives in one namespace, so `kubectl delete namespace
# enterprise-ai` is a complete uninstall. That property is deliberate — this runs on a
# cluster whose real job is GPU training, and whoever finds these pods must be able to
# remove them in one command without hunting cluster-wide objects.
apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    # No GPU is ever requested by this tenant. Recorded as a label so it is visible in
    # `kubectl get ns --show-labels` without reading the docs.
    mainframe.3dl.dev/gpu: "none"
    mainframe.3dl.dev/workload: "long-running-service"
