# The gateway — sole token validator, single budget admission point, meters every request.
#
# Exposed on a NodePort so the IDE and terminal coding agents can reach it from the LAN or
# tailnet. Deliberately NOT fronted by Caddy: it is not published to the internet in this
# deployment. The chat surface reaches it in-cluster.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: enterprise-ai
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 4000, targetPort: 4000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  namespace: enterprise-ai
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: enterprise-ai
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        # Roll the pod when the generated catalogue changes, otherwise a config update
        # silently does nothing until the next unrelated restart.
        checksum/config: "REPLACED_BY_DEPLOY"
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-v1.77.3-stable
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: GATEWAY_MASTER_KEY } }
            - name: LITELLM_SALT_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: GATEWAY_SALT_KEY } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: GATEWAY_DATABASE_URL } }
            - name: REDIS_URL
              value: redis://valkey:6379
            # Forge agent key: runtime inference only, can spend but not mint keys.
            - name: FORGE_API_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FORGE_API_KEY } }
          ports: [{ containerPort: 4000 }]
          volumeMounts:
            - { name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true }
            # The callback module the config names. litellm imports it by bare module name
            # from the working directory, so it has to land next to config.yaml — without
            # it the proxy raises ImportError at startup and crash-loops.
            - { name: config, mountPath: /app/strip_reasoning.py, subPath: strip_reasoning.py, readOnly: true }
          readinessProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { memory: "2Gi" }
      volumes:
        - name: config
          configMap:
            name: gateway-config
