# One named, resident HERMES agent instance. Rendered by deploy/bin/provision-agent.sh
# and by control-plane/app/agents.py (the self-serve portal path) — the placeholders are
# substituted literally, so this file is not applyable on its own.
#
#   __USER__          Keycloak username; with __NAME__ it forms every object name
#   __NAME__          the user-chosen agent slug
#   __IMAGE__         the Hermes Agent image (nousresearch/hermes-agent:<date-tag>)
#   __MODEL__         a model id the gateway serves, bare (NO `enterprise-ai/` prefix)
#   __CONTEXT_LENGTH__  explicit context window for the model (Hermes cannot read it from
#                     our gateway's /v1/models; a missing value reads as "context exceeded")
#   __MAX_TOKENS__    output cap, <= the model's provider cap (deepinfra caps some models at
#                     32768; exceeding it 400s and Hermes misreports it as "context exceeded")
#   __CFGSUM__        checksum of the seeded config.yaml, so a config change rolls the pod
#   __MODEL_SOURCE__  `integrated` or `byo` (Contract 4) — provenance, see the label below
#   __KEY_SECRET__    the Secret holding OPENAI_API_KEY: `agent-<user>-<name>-key` (the
#                     integrated virtual key) or `agent-<user>-<name>-byo` (the user's own)
#   __KEYSUM__        checksum of the model-API credential (rolls the pod on rotation)
#   __EMAILSUM__ / __SLACKSUM__ / __DISCORDSUM__   connector checksums or `none`
#
# This is the RETARGET of the surface from opencode to Hermes
# (docs/design/records/agents-surface-hermes-retarget.md), validated live 2026-08-10.
# The residency shape (RWO PVC, replicas 1, Recreate, scale-to-zero stop) is unchanged from
# Contract 2 — only the container it wraps changed. Contract 6 still freezes deploy/workspace/*;
# this file sits beside it and is Hermes-only.
---
# The seeded Hermes config. Copied onto the PVC at /opt/data/config.yaml by the init
# container BELOW (never mounted read-only over HERMES_HOME — Hermes rewrites config at
# runtime). Source of truth for the body: deploy/agent/hermes-config.yaml.tmpl.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-__USER__-__NAME__-config
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
data:
  config.yaml: |
    providers:
      gateway:
        base_url: __API_BASE__
        key_env: OPENAI_API_KEY
        discover_models: true
    model:
      provider: gateway
      default: __MODEL__
      context_length: __CONTEXT_LENGTH__
      max_tokens: __MAX_TOKENS__
    terminal:
      backend: local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-__USER__-__NAME__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
spec:
  accessModes: [ReadWriteOnce]
  # local-path (node disk). NON-DURABLE like a workspace PVC (k3s-worker is cattle); the
  # tank-backed dataset that fixes this is staged behind a reboot gate. Matters more here:
  # Contract 2 promises `stopped` keeps state and only `deleted` destroys it, and a node
  # rebuild breaks that without passing through either transition.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-__USER__-__NAME__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
    agent.enterprise-ai/model-source: "__MODEL_SOURCE__"
spec:
  # created/running = replicas 1; stopped = replicas 0 (PVC retained); deleted = remove
  # these objects then the PVC (Contract 2). Scale-to-zero makes "stopped costs nothing"
  # literally true: no pod, no status.startTime, no cAdvisor counter.
  replicas: 1
  # RWO PVC + a live session: two replicas is never wanted, and a rolling update would try
  # to start a second against the same volume. Hermes is single-writer; Recreate is required.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
      agent.enterprise-ai/user: "__USER__"
      agent.enterprise-ai/name: "__NAME__"
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: enterprise-ai-framework
        app.kubernetes.io/component: agent
        # Contract 3's resident-time/compute meter (enterpriseaiframework-914) keys on THESE
        # labels, not the virtual key: compute is the pod's, so a BYO agent with no gateway
        # ledger row still bills for the hours it was resident.
        agent.enterprise-ai/user: "__USER__"
        agent.enterprise-ai/name: "__NAME__"
        # PROVENANCE, Contract 4. `integrated` = inference through the __USER__::agents/__NAME__
        # virtual key on our gateway (on the one bill). `byo` = the user's own credential,
        # off our gateway by declaration; this label is what stops a BYO agent rendering as a
        # silent $0. Deliberately NOT in the immutable selector so an agent can switch modes.
        agent.enterprise-ai/model-source: "__MODEL_SOURCE__"
      annotations:
        # config.yaml's checksum — a config change (model, context, gateway) rolls the pod.
        checksum/config: "__CFGSUM__"
        # The model-API credential's checksum. env from a secretKeyRef is injected at pod
        # start and never updated, so a rotated key MUST roll the pod or the agent 401s
        # forever, silently, on a surface nobody watches. A hash, never the key.
        checksum/api-key: "__KEYSUM__"
        # The connector credentials' checksums (email/Slack/Discord), same reason: envFrom is
        # injected at pod start and never updated. "none" when the agent has no such connector.
        checksum/email: "__EMAILSUM__"
        checksum/slack: "__SLACKSUM__"
        checksum/discord: "__DISCORDSUM__"
    spec:
      serviceAccountName: agent
      automountServiceAccountToken: false
      # NO securityContext, DELIBERATELY (validated live 2026-08-10). The Hermes image's
      # s6-overlay init MUST start as root to fix /run and chown the PVC, then drops the
      # agent process to uid/gid 10000 itself. Under runAsNonRoot/runAsUser:1000/drop:[ALL]
      # the s6 preinit dies: "/run belongs to uid 0 ... lacking the privileges to fix it".
      # Net posture: the long-running agent process is still non-root (10000) and the
      # NetworkPolicy (63-agent-common.yaml) still locks egress; only the brief s6 init is
      # root. This is the one securityContext difference from the frozen opencode template
      # and it is forced by the image, not chosen.
      initContainers:
        # Seed HERMES_HOME/config.yaml from the per-agent ConfigMap onto the writable PVC.
        # Runs as root (image default) so the chown to the agent uid succeeds — the daemon
        # then reads and rewrites config as 10000.
        - name: config-seed
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp /seed/config.yaml /opt/data/config.yaml && chown 10000:10000 /opt/data/config.yaml && echo seeded"]
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: seed, mountPath: /seed, readOnly: true }
      containers:
        - name: agent
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          # Keep the image ENTRYPOINT (s6-overlay). The long-lived daemon is the foreground
          # messaging gateway + cron scheduler; s6 supervises and auto-restarts it. Consoles
          # ATTACH with `hermes --tui` over the Kubernetes pods/exec subresource
          # (control-plane/app/agent_console.py), sharing /opt/data/state.db — no console
          # spawns the daemon, and a disconnect never ends it (Contract 2).
          args: ["gateway", "run"]
          env:
            - { name: HERMES_HOME, value: "/opt/data" }
            # WHERE INFERENCE GOES (Contract 4). config.yaml's provider block names key_env:
            # OPENAI_API_KEY; INTEGRATED points base_url at our gateway with the
            # __USER__::agents/__NAME__ virtual key from `agent-…-key`; BYO points base_url at
            # the user's provider with their credential from `agent-…-byo`.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: __KEY_SECRET__, key: OPENAI_API_KEY }
          # The tenant connectors — email (enterpriseaiframework-a4e), Slack + Discord (-783) —
          # an EXTERNAL provider/workspace/guild reached with the tenant's own credential.
          # There is NO mail or chat server in this deployment. envFrom + optional:true keeps
          # them ADDITIVE: an agent with none starts exactly as it did before. `gateway run`
          # enables whichever connector's env vars it recognises.
          envFrom:
            - secretRef: { name: agent-__USER__-__NAME__-email, optional: true }
            - secretRef: { name: agent-__USER__-__NAME__-slack, optional: true }
            - secretRef: { name: agent-__USER__-__NAME__-discord, optional: true }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
          resources:
            # A workspace-sized envelope. k3s-worker runs live GPU training; an agent keeps
            # running when nobody is watching, so the limit is real.
            requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "1Gi" }
            limits:   { cpu: "1",    memory: "2Gi",   ephemeral-storage: "4Gi" }
          # No ports and no tcp probe: `gateway run` opens no inbound port, and the console
          # attaches over the API server's exec subresource, not a pod Service. s6 supervises
          # the process in-container; k8s readiness is "container up".
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: agent-__USER__-__NAME__ }
        - name: seed
          configMap: { name: agent-__USER__-__NAME__-config }
