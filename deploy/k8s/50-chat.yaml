# The chat surface.
#
# NodePort, fronted by Caddy on the gateway VM which terminates TLS for the public name.
# ENDPOINTS=custom is load-bearing, not cosmetic: without it LibreChat also offers direct
# openAI / anthropic / google / azure / bedrock endpoints, which are unmetered, unaudited
# routes around the gateway (dogfood-findings.md finding 4).
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: enterprise-ai
spec:
  selector: { app: chat }
  ports: [{ name: http, port: 3080, targetPort: 3080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: chat-nodeport
  namespace: enterprise-ai
spec:
  type: NodePort
  selector: { app: chat }
  ports:
    - name: http
      port: 3080
      targetPort: 3080
      nodePort: 30380
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: enterprise-ai
spec:
  replicas: 1
  selector: { matchLabels: { app: chat } }
  template:
    metadata:
      labels: { app: chat }
      annotations:
        checksum/config: "REPLACED_BY_DEPLOY"
    spec:
      # The OIDC token exchange happens from inside this pod, and the cluster is not on
      # the tailnet: it resolves the funnel hostname to the public ingress and the
      # connection is reset. Pin the name to the gateway VM's LAN address so the
      # backchannel goes straight there, over the same hostname and port the browser uses
      # — the issuer must match on both sides or the client rejects it.
      #
      # The browser is unaffected: it resolves the same name via the tailnet or the
      # public funnel as before.
      hostAliases:
        - ip: "192.168.2.42"
          hostnames:
            - "gateway.tailcb6ef9.ts.net"
      containers:
        - name: librechat
          # Must equal the tag in bundle/docker-compose.yml — asserted by
          # tests/test_chat_surface_version.py. The bundle and the cluster read the SAME
          # bundle/librechat/librechat.yaml (deploy/bin/deploy.sh renders it into the
          # chat-config ConfigMap), and v0.8.0 responds to a config it cannot validate by
          # dropping the whole custom config and coming up healthy-but-empty. Skew between
          # these two lines is therefore not cosmetic.
          image: ghcr.io/danny-avila/librechat:v0.8.7
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "3080" }
            - { name: MONGO_URI, value: "mongodb://chatdb:27017/librechat" }
            - { name: CONFIG_PATH, value: "/app/librechat.yaml" }
            # Public origin — must match what the browser used, or the OIDC callback and
            # cookie domain will not line up.
            - name: DOMAIN_CLIENT
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: PUBLIC_BASE_URL } }
            - name: DOMAIN_SERVER
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: PUBLIC_BASE_URL } }

            # One control plane: exactly one route out of the building.
            # custom,agents — NOT just "custom". This list is literal: naming only "custom"
            # also drops the agents endpoint, and the agents framework is where MCP servers,
            # memory, tools, file search and web search live. The bypass this closes is the
            # built-in openAI/anthropic/google/azure/bedrock endpoints, which are absent from
            # the list and therefore still disabled.
            - { name: ENDPOINTS, value: "custom,agents" }
            - { name: ALLOW_EMAIL_LOGIN, value: "false" }
            - { name: ALLOW_REGISTRATION, value: "false" }
            - { name: ALLOW_SOCIAL_LOGIN, value: "true" }
            - { name: ALLOW_SOCIAL_REGISTRATION, value: "true" }

            - name: OPENID_ISSUER
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: OPENID_ISSUER } }
            - { name: OPENID_CLIENT_ID, value: "librechat" }
            - name: OPENID_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CHAT_CLIENT_SECRET } }
            - { name: OPENID_CALLBACK_URL, value: "/oauth/openid/callback" }
            - { name: OPENID_SCOPE, value: "openid profile email" }
            - { name: OPENID_BUTTON_LABEL, value: "Sign in with Enterprise AI" }
            # Skip the login page entirely and go straight to Keycloak.
            #
            # There is exactly one way to sign in here, so the page only ever offered a
            # single button — and inside the portal's Chat tab it was worse than
            # redundant: you had already authenticated to reach the tab, so being asked
            # to "sign in" again is the seam this whole surface exists to remove. The
            # redirect is silent because the Keycloak session already exists.
            - { name: OPENID_AUTO_REDIRECT, value: "true" }
            - name: OPENID_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CHAT_SESSION_SECRET } }

            - name: CREDS_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CHAT_CREDS_KEY } }
            - name: CREDS_IV
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CHAT_CREDS_IV } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CHAT_JWT_SECRET } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CHAT_JWT_REFRESH_SECRET } }
            # Login throttling. LibreChat defaults to 7 attempts per 5 minutes, which a
            # test run trips immediately and then reads as a broken login rather than a
            # rate limit. Raised, but deliberately not disabled — it is a real protection.
            - { name: LOGIN_MAX, value: "30" }
            - { name: LOGIN_WINDOW, value: "5" }
            - { name: BAN_VIOLATIONS, value: "false" }
            - name: CHAT_VIRTUAL_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CHAT_VIRTUAL_KEY } }

            # ---- web search (enterpriseaiframework-0be) ----------------------------
            #
            # These three MUST exist here and MUST be referenced from librechat.yaml as
            # ${...} placeholders. LibreChat does not read those config values literally —
            # it extracts an environment-variable NAME from each one and resolves it
            # (extractWebSearchEnvVars -> extractVariableName). A literal in the YAML
            # counts as a MISSING field, so the provider is skipped and searchProvider
            # falls back to its default of `serper` with no key: web search appears in the
            # UI and every call fails. Absent env vars here produce the same result.
            # tests/test_web_search.py asserts compose and this file supply the same set.
            #
            # Services in deploy/k8s/07-web-search.yaml.
            - { name: SEARXNG_INSTANCE_URL, value: "http://searxng:8080" }
            # `firecrawl` is the WIRE SHAPE, not the vendor: webfetch speaks Firecrawl's
            # /v2/scrape contract so LibreChat's existing client works unmodified. Real
            # Firecrawl (cloud or self-hosted) is a change to these two values only.
            - { name: FIRECRAWL_API_URL, value: "http://webfetch:3002" }
            - name: FIRECRAWL_API_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: WEBFETCH_TOKEN } }
          ports: [{ containerPort: 3080 }]
          volumeMounts:
            - { name: config, mountPath: /app/librechat.yaml, subPath: librechat.yaml, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 3080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { memory: "2Gi" }
      volumes:
        - name: config
          configMap:
            name: chat-config
