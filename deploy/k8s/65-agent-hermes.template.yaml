# One named, resident HERMES agent instance — the Agents pillar (gateway agents), NOT the
# Code pillar (opencode). Rendered by control-plane/app/agents.py render_hermes(); the
# placeholders are substituted literally, so this file is not applyable on its own.
#
#   __USER__      Keycloak username; with __NAME__ it forms every object name
#   __NAME__      the user-chosen agent slug
#   __IMAGE__     the hermes image (nousresearch/hermes-agent:<tag>) — NOT the workspace
#                 image; a gateway agent does not share the Code pillar's opencode artefact
#   __MODEL_SOURCE__  `integrated` or `byo` (agents-surface Contract 4) — provenance label
#   __KEY_SECRET__    the Secret holding OPENAI_API_KEY + the console credential:
#                     `agent-<user>-<name>-key` (the integrated virtual key, alias
#                     <user>::agents/<name>, plus DASHBOARD_USERNAME/DASHBOARD_PASSWORD)
#   __CFGSUM__    checksum of the first-boot seed ConfigMap (agent-<user>-<name>-config)
#   __KEYSUM__    checksum of the integrated key, so a real rotation rolls the pod
#   __EMAILSUM__/__SLACKSUM__/__DISCORDSUM__  connector-credential checksums, or `none`
#
# This is a SIBLING of 64-agent.template.yaml, not an extension of it: the design record
# docs/design/records/agents-gateway-console.md (Contracts A/B/C/D) is explicit that the
# opencode template/entrypoint/provisioner are the conflated Code-pillar path and are not
# reused for gateway agents. The differences from the opencode template ARE the design:
#
#   * ONE container over one PVC (Contract B, corrected). The hermes s6 image runs BOTH the
#     gateway AND its own dashboard on :9119 under one s6 supervisor when `HERMES_DASHBOARD`
#     is set — so the dashboard SEES and CONTROLS the gateway (gateway status, restart on a
#     model change) instead of being blind to a sibling container. An earlier two-container
#     split (a separate `hermes dashboard`) put the dashboard in its own PID namespace where
#     it reported the gateway as "stopped" and its restart hit nothing; co-locating them is
#     the image's intended design and is simpler.
#   * a FIRST-BOOT-ONLY seed initContainer (Contract B): the live hand-applied agents seed
#     config.yaml with an UNCONDITIONAL `cp` on every boot, which wipes every setting the
#     agent or its dashboard persisted. This copies the seed IFF the PVC has none.
#   * state at /opt/data (`HERMES_HOME`), not opencode's /workspace; no ttyd, no
#     OPENCODE_* env, no tenant/skill mounts (those are the Code surface's).
#   * the console port (:9119) is admitted from the control-plane pod alone by the
#     namespace-wide 66-agent-console-common.yaml (the control-plane SA has no
#     `networkpolicies` authority, so admission is a deploy-time common policy, not a
#     per-agent object — same "the proxy is the only door" posture, no RBAC widening).
#
# `agent.enterprise-ai/type: hermes` (Contract A) is baked in here, not a placeholder, so
# this one template can be the parametrised base a future type reuses.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-__USER__-__NAME__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
spec:
  accessModes: [ReadWriteOnce]
  # local-path (node disk), NON-DURABLE exactly as the workspace/opencode-agent PVCs are;
  # Contract 2's promise that `stopped` keeps state and only `deleted` destroys it holds
  # across scale-to-zero, not across a node rebuild. The state that matters lives here:
  # config.yaml, sessions/, memories/ and the kanban db, all under /opt/data.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-__USER__-__NAME__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
spec:
  # ClusterIP. There is no NodePort and there must not be one — the dashboard is the
  # agent's control surface holding a spendable key. The portal proxies it at
  # /agents/__NAME__/ on the chat origin, resolving __USER__ from the authenticated
  # identity and never from the path (Contract 1); enterpriseaiframework-8e4 built that.
  selector:
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
  ports:
    # The hermes dashboard's native port (agents-gateway-console.md Contract B/C), served by
    # the agent container's own s6 dashboard alongside the gateway.
    - name: dashboard
      port: 9119
      targetPort: 9119
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-__USER__-__NAME__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
    agent.enterprise-ai/model-source: "__MODEL_SOURCE__"
    # The type is read from HERE by list_agents (the object label), and from the pod
    # template below by a per-type selector — model-source's two placements exactly.
    agent.enterprise-ai/type: hermes
spec:
  # `created`/`running` is replicas: 1; `stopped` is replicas: 0 with the PVC retained;
  # `deleted` removes these objects then the PVC (Contract 2, unchanged from the opencode
  # path). Scale-to-zero is what makes "stopped costs nothing" literally true.
  replicas: 1
  # ReadWriteOnce PVC and a live gateway session: a rolling update would try to start a
  # second pod against the same volume. Recreate never runs two.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
      agent.enterprise-ai/user: "__USER__"
      agent.enterprise-ai/name: "__NAME__"
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: enterprise-ai-framework
        app.kubernetes.io/component: agent
        # Contract 3's attribution key for the resident-time/compute meter
        # (enterpriseaiframework-914) is read from THESE labels, not the virtual key, so a
        # BYO agent that produces no gateway row still bills for the hours it is resident.
        agent.enterprise-ai/user: "__USER__"
        agent.enterprise-ai/name: "__NAME__"
        # Provenance, Contract 4 (integrated vs byo). Deliberately not in the selector.
        agent.enterprise-ai/model-source: "__MODEL_SOURCE__"
        # The Agents-pillar type, Contract A — the harness this pod runs, so a per-type
        # console/model selector reads it off the pod.
        agent.enterprise-ai/type: hermes
      annotations:
        # The first-boot seed's checksum. Unlike the opencode entrypoint checksum this is
        # NOT a lever to reconfigure a running agent — the seed applies once and the PVC
        # config is authoritative after (Contract B). It rolls a NEW agent whose seed
        # content changed and is a truthful record of what a first boot was given; live
        # settings are changed through the dashboard API (Contract D), never by re-seeding.
        checksum/config: "__CFGSUM__"
        # The integrated key's checksum — rolls the pod when the key actually changes
        # (sentinel replaced by a real key, a deliberate rotation), because a secretKeyRef
        # env is injected at pod start and never updated, so a running agent would keep
        # presenting the old key and 401 silently. A hash, never the key.
        checksum/api-key: "__KEYSUM__"
        # The connector credentials' checksums (email/slack/discord), each rolling the pod
        # when that credential is re-supplied, for the same envFrom-injected-once reason.
        # "none" when the agent has no such connector. Hashes the provisioner stores beside
        # the credential it cannot read back — a re-run that supplies nothing is a no-op.
        checksum/email: "__EMAILSUM__"
        checksum/slack: "__SLACKSUM__"
        checksum/discord: "__DISCORDSUM__"
    spec:
      serviceAccountName: agent
      automountServiceAccountToken: false
      securityContext:
        # The hermes image is an s6-based image: PID 1 starts as root and drops to the app
        # user (uid 10000) via s6-applyuidgid, which needs CAP_SETUID/SETGID — so this pod
        # deliberately does NOT drop capabilities or force runAsNonRoot (verified: dropping
        # ALL caps crashes s6 with "unable to set supplementary group list", which is why
        # the live agents run with a minimal securityContext too). fsGroup makes the RWO PVC
        # group-writable by uid 10000 so the agent creates its sessions/memories/kanban db
        # on a fresh volume with no manual chown; seccompProfile keeps the syscall filter.
        fsGroup: 10000
        seccompProfile: { type: RuntimeDefault }
      # FIRST-BOOT-ONLY seed (Contract B, the defect this record fixes). The live agents'
      # init runs `cp /seed/config.yaml /opt/data/config.yaml` UNCONDITIONALLY on every
      # boot, wiping every setting the agent or dashboard persisted. This copies the seed
      # IFF the PVC has none; after first boot the agent's own config is authoritative and
      # the platform never overwrites it. Operator control comes from the dashboard API
      # (Contract D), not from re-seeding.
      initContainers:
        - name: config-seed
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          # The command overrides the s6 entrypoint, so it runs as the image's root user and
          # writes onto the fsGroup-owned volume; no s6, no capability handling needed here.
          command:
            - sh
            - -c
            - '[ -f /opt/data/config.yaml ] || cp /seed/config.yaml /opt/data/config.yaml'
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: seed, mountPath: /seed, readOnly: true }
      containers:
        # THE AGENT — the resident gateway AND its own native dashboard, in ONE container
        # under the image's s6 supervisor. `args: [gateway, run]` runs the gateway;
        # HERMES_DASHBOARD=1 makes s6 ALSO run `hermes dashboard` on :9119, co-located, so
        # the dashboard can see and control the gateway (Contract C/D). The June-2026
        # hardening means a non-loopback dashboard REQUIRES an auth provider; the image's s6
        # dashboard run-script registers the bundled basic provider from
        # HERMES_DASHBOARD_BASIC_AUTH_USERNAME/_PASSWORD, so the console proxy
        # (enterpriseaiframework-8e4) form-logs-in with the same credential from the Secret.
        - name: agent
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          env:
            - { name: HERMES_HOME, value: "/opt/data" }
            # INTEGRATED inference (Contract 4): the agent's provider is configured in the
            # seeded config.yaml as `providers.gateway` (base_url http://gateway:4000/v1,
            # key_env OPENAI_API_KEY, discover_models true), so inference goes through the
            # __USER__::agents/__NAME__ virtual key on our gateway and lands on the one bill.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: __KEY_SECRET__, key: OPENAI_API_KEY }
            # The built-in s6 dashboard, co-located with the gateway.
            - { name: HERMES_DASHBOARD, value: "1" }
            - { name: HERMES_DASHBOARD_HOST, value: "0.0.0.0" }
            - { name: HERMES_DASHBOARD_PORT, value: "9119" }
            # The console credential, from the key Secret — the same one the -8e4 proxy
            # presents on the user's behalf, so the browser never sees the dashboard login.
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef: { name: __KEY_SECRET__, key: DASHBOARD_USERNAME }
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef: { name: __KEY_SECRET__, key: DASHBOARD_PASSWORD }
          # The tenant's own Slack/Discord/mailbox, reached with the tenant's own tokens.
          # There is no chat or mail server in this deployment — the same posture, Secrets
          # and `optional: true` additivity as the opencode agent. envFrom is applied before
          # `env`, so a connector Secret cannot override OPENAI_API_KEY / HERMES_HOME.
          envFrom:
            - secretRef: { name: agent-__USER__-__NAME__-email, optional: true }
            - secretRef: { name: agent-__USER__-__NAME__-slack, optional: true }
            - secretRef: { name: agent-__USER__-__NAME__-discord, optional: true }
          ports:
            - { name: dashboard, containerPort: 9119 }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
          resources:
            requests: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
            limits:   { cpu: "1",    memory: "2Gi", ephemeral-storage: "4Gi" }
          # Readiness on the dashboard port: the pod is serving when :9119 answers (its
          # unauthenticated 401/302 is still proof the process holds the port), and the
          # gateway is up under the same s6 by then.
          startupProbe:
            httpGet: { path: /, port: 9119 }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /, port: 9119 }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: agent-__USER__-__NAME__ }
        # The first-boot seed, mounted read-only. The initContainer copies config.yaml off
        # it once; the running agent never reads it again.
        - name: seed
          configMap: { name: agent-__USER__-__NAME__-config, defaultMode: 0444 }
