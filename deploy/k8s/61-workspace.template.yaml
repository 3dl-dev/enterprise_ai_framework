# One user's workspace. Rendered by deploy/bin/provision-workspace.sh — the placeholders
# are substituted literally, so this file is not applyable on its own.
#
#   __USER__      Keycloak username, also the PVC/Deployment/Service name suffix
#   __IMAGE__     workspace image reference in the rail registry
#   __MODEL__     aider's default model, a name from the gateway catalogue
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ws-__USER__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: workspace
    workspace.enterprise-ai/user: "__USER__"
spec:
  accessModes: [ReadWriteOnce]
  # local-path, which lives on the node's disk. NON-DURABLE: k3s-worker is cattle and is
  # rebuilt wholesale. The tank-backed dataset that fixes this is staged behind a reboot
  # gate; until it lands, treat a workspace as disposable and tell users so.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ws-__USER__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: workspace
    workspace.enterprise-ai/user: "__USER__"
spec:
  # ClusterIP. There is no NodePort and there must not be one.
  #
  # This used to publish oauth2-proxy on a per-user NodePort, which made the workshop a
  # separate website on a LAN address — unreachable from any other network, where it did
  # not fail cleanly but hung until the browser gave up. The portal proxies it now, on the
  # same origin as chat, so there is nothing here for a node to publish.
  #
  # Both ports are reachable only from the control-plane pod; see the NetworkPolicy in
  # 60-workspace-common.yaml, and workshop.py for what guards them beyond that.
  selector:
    app.kubernetes.io/component: workspace
    workspace.enterprise-ai/user: "__USER__"
  ports:
    - name: shell
      port: 7682
      targetPort: 7682
    - name: ttyd
      port: 7681
      targetPort: 7681
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-__USER__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: workspace
    workspace.enterprise-ai/user: "__USER__"
spec:
  replicas: 1
  # The PVC is ReadWriteOnce and the shell holds live state. Two replicas of a workspace
  # is never what anyone wanted, and a rolling update would try to start one.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/component: workspace
      workspace.enterprise-ai/user: "__USER__"
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: enterprise-ai-framework
        app.kubernetes.io/component: workspace
        workspace.enterprise-ai/user: "__USER__"
      annotations:
        checksum/key: "__KEYSUM__"
    spec:
      serviceAccountName: workspace
      automountServiceAccountToken: false
      # Same trick the chat surface uses: the cluster is not on the tailnet, so the
      # funnel hostname resolves to the public ingress and the connection is reset.
      # Pinned to the gateway VM's LAN address so the OIDC backchannel goes straight
      # there over the same hostname the browser used — the issuer string must match on
      # both sides or the token is rejected.
      hostAliases:
        - ip: "192.168.2.42"
          hostnames: ["gateway.tailcb6ef9.ts.net"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # The PVC arrives owned by root; without this the workspace is read-only to the
        # user it was created for, which reads as "aider is broken".
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        # ---------------------------------------------------------------- the shell
        - name: ttyd
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: WS_USER, value: "__USER__" }
            - { name: WS_PROJECT_DIR, value: "/workspace/project" }
            - { name: WS_PUBLISH_URL, value: "__PUBLISH_URL__" }
            # opencode keeps its sessions in an sqlite db under XDG_DATA_HOME. That
            # defaulted to $HOME, which is an emptyDir on this pod — so "resume my last
            # session" was erased by every restart, including every routine reprovision.
            # Pointed at the PVC it survives, which is the whole point of the feature.
            # Deliberately NOT inside /workspace/projects: it is ours, not the child's,
            # and must never be scanned, published or committed with their work.
            - { name: XDG_DATA_HOME, value: "/workspace/.agent-state" }
            # The credential the control plane presents on every request. entrypoint.sh
            # refuses to start without it rather than coming up unauthenticated.
            - name: WS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: enterprise-ai-secrets, key: WORKSPACE_INTERNAL_TOKEN }
            # One route out of the building. The pod has no provider credential of any
            # kind — this is a virtual key on our own gateway.
            - { name: OPENAI_API_BASE, value: "__GATEWAY_BASE__/v1" }
            - { name: OPENAI_BASE_URL, value: "__GATEWAY_BASE__/v1" }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: ws-__USER__-key, key: OPENAI_API_KEY }
            # Aider needs the openai/ prefix to treat the gateway as an OpenAI-compatible
            # endpoint rather than looking the bare name up in litellm's provider table.
            - { name: AIDER_MODEL, value: "openai/__MODEL__" }
          ports:
            # Named, not published. ttyd binds loopback; this is documentation and a
            # target for nothing.
            - { name: ttyd, containerPort: 7681 }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            # Published output. RWO is node-scoped in Kubernetes, so several pods on the
            # SAME node may mount it — true today because there is one worker. If a second
            # worker is ever added, workspaces scheduled there lose publishing and this
            # has to become a real upload service instead of a shared mount.
            - { name: published, mountPath: /published }
            - { name: home, mountPath: /home/coder }
            # The operator's house rules for the terminal agent, layered under the
            # platform facts baked into the image (deploy/workspace/Dockerfile,
            # enterpriseaiframework-cbf). Mounted as a DIRECTORY, not with subPath: a
            # subPath mount does not receive ConfigMap updates from the kubelet's sync —
            # only a whole-volume mount does — and the point of a ConfigMap here is that
            # an operator's edit reaches an already-running pod with no restart. One
            # ConfigMap for the whole deployment (not one per __USER__): every workspace
            # this namespace ever provisions mounts the same one, matching "one control
            # plane" rather than making agent behaviour a per-user setting.
            # `optional: true`: a pod scheduled before deploy/bin/provision-workspace.sh
            # has ever created this ConfigMap still starts, with an empty tenant
            # directory, instead of hanging in ContainerCreating — the ConfigMap is
            # supposed to always exist by the time a pod is created (the script creates it
            # before applying this template), but the guarantee should not depend on that
            # ordering never being violated.
            - { name: tenant-instructions, mountPath: /etc/opencode/tenant, readOnly: true }
            # THIS user's own remembered chat preferences (enterpriseaiframework-471,
            # done-condition 3) — unlike tenant-instructions above, one ConfigMap PER
            # __USER__, refreshed from LibreChat's Mongo by
            # deploy/bin/lib/workspace-memory.sh via provision-workspace.sh. Same
            # directory-not-subPath reasoning as tenant-instructions: a directory mount
            # picks up a ConfigMap update on the kubelet's sync with no pod restart,
            # subPath does not (tests-live/test_workspace_instructions.py measures this
            # both ways). `optional: true`: a pod for a user nobody has ever provisioned
            # with this script yet, or whose sync failed (Mongo unreachable, chat
            # database not up), still starts with an empty memory directory rather than
            # hanging in ContainerCreating.
            - { name: workspace-memory, mountPath: /etc/opencode/memory, readOnly: true }
            # enterpriseaiframework-6ff: the SAME tenant Agent Skills corpus the chat
            # surface loads (deploy/k8s/50-chat.yaml), read here by opencode's OWN native
            # skill loader — `skills.paths` in deploy/workspace/opencode.json points at
            # /etc/opencode/tenant-skills. No invocation code of ours on either surface;
            # only the directory is shared. One ConfigMap per skill, same reasoning as
            # the chat surface's mount — see deploy/bin/lib/tenant-skills.sh for why not
            # one combined ConfigMap, and note the same cost here: a new skill needs a
            # new volume/volumeMount pair below, not just a new directory in the corpus.
            - { name: skill-incident-escalation, mountPath: /etc/opencode/tenant-skills/incident-escalation, readOnly: true }
            - { name: skill-meeting-notes-format, mountPath: /etc/opencode/tenant-skills/meeting-notes-format, readOnly: true }
          resources:
            # k3s-worker runs live GPU training. A student running `make -j` must not be
            # able to take the node down with them, so the limit is real and the request
            # is honest about the steady state.
            requests: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
            limits:   { cpu: "1",    memory: "2Gi", ephemeral-storage: "4Gi" }
          # An exec probe, not tcpSocket. The kubelet dials the POD IP, and ttyd listens
          # on loopback only — a tcpSocket probe is refused every time, so the container
          # is killed and restarted forever while ttyd is in fact healthy. Observed, not
          # theorised: the first cut of this file used tcpSocket and CrashLooped at
          # exactly failureThreshold x periodSeconds.
          startupProbe:
            exec:
              command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7681"]
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7681"]
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: published
          persistentVolumeClaim:
            claimName: published
        - name: workspace
          persistentVolumeClaim: { claimName: ws-__USER__ }
        # $HOME is not on the PVC. aider's caches and pip's build dirs go here and are
        # rebuilt on restart; keeping them out of the PVC means the durable volume holds
        # the user's code and nothing else.
        - name: home
          emptyDir: { sizeLimit: 2Gi }
        # Deployment-wide, not __USER__-scoped: deploy/bin/provision-workspace.sh (via
        # deploy/bin/lib/tenant-instructions.sh) seeds this ConfigMap once, from
        # deploy/workspace/AGENTS.md verbatim, and every workspace pod in the namespace
        # mounts the same one. An operator replaces it with
        # `provision-workspace.sh <user> --instructions <path>` — no image build, and
        # because the mount above is a directory (not subPath) a content change reaches
        # an already-running pod on the kubelet's own ConfigMap sync, no restart. `optional:
        # true` matches the volumeMount above.
        - name: tenant-instructions
          configMap: { name: workspace-tenant-instructions, optional: true }
        # Per-__USER__, not deployment-wide — see the volumeMount comment above.
        - name: workspace-memory
          configMap: { name: workspace-memory-__USER__, optional: true }
        # Seeded by deploy/bin/lib/tenant-skills.sh from bundle/skills/ — the identical
        # corpus and identical ConfigMaps the chat surface mounts above 50-chat.yaml.
        # `optional: true` for the same reason as tenant-instructions: a pod scheduled
        # before deploy.sh has run still starts, with no skills, instead of hanging.
        - name: skill-incident-escalation
          configMap: { name: chat-skill-incident-escalation, optional: true }
        - name: skill-meeting-notes-format
          configMap: { name: chat-skill-meeting-notes-format, optional: true }
