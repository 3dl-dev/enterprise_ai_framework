apiVersion: v1
kind: Service
metadata:
  name: codeapi-sandbox
  namespace: enterprise-ai
spec:
  selector: { app: codeapi-sandbox }
  ports: [{ name: http, port: 2000, targetPort: 2000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeapi-sandbox
  namespace: enterprise-ai
spec:
  replicas: 1
  selector: { matchLabels: { app: codeapi-sandbox } }
  template:
    metadata: { labels: { app: codeapi-sandbox } }
    spec:
      # NsJail mode needs real namespace/cgroup/mount capabilities — no Docker socket,
      # no privileged pod, same capability list as bundle/docker-compose.yml's
      # codeapi-sandbox (mirrors upstream's own docker-compose.mac.yml, its reference
      # recipe for running this target without /dev/kvm).
      containers:
        - name: codeapi-sandbox
          image: REPLACED_BY_DEPLOY # codeapi, api/Dockerfile, target sandbox-build
          command: ["/sandbox_api/entrypoint.sh"]
          securityContext:
            capabilities:
              add: [SYS_ADMIN, SYS_CHROOT, SYS_PTRACE, SETUID, SETGID, NET_ADMIN,
                    DAC_OVERRIDE, DAC_READ_SEARCH, CHOWN, FOWNER, FSETID, KILL,
                    SETFCAP, MKNOD]
          env:
            - { name: KVM_ENABLED, value: "false" }
            - { name: CODEAPI_HARDENED_SANDBOX_MODE, value: "true" }
            - { name: EGRESS_GATEWAY_URL, value: "http://codeapi-egress-gateway:3190" }
            - { name: SANDBOX_PACKAGES_DIRECTORY, value: "/pkgs" }
            - { name: SANDBOX_MAX_CONCURRENT_JOBS, value: "4" }
            - { name: SANDBOX_PER_JOB_UIDS, value: "true" }
            - { name: SANDBOX_JOB_UID_BASE, value: "200000" }
            - { name: SANDBOX_JOB_GID_BASE, value: "200000" }
            - { name: SANDBOX_ALLOWED_LOCAL_NETWORK_PORT, value: "3190" }
            - { name: SANDBOX_FORWARD_TARGET, value: "codeapi-egress-gateway:3190" }
            - { name: SANDBOX_REQUIRE_EGRESS_MANIFEST, value: "true" }
            - name: SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY } }
          ports: [{ containerPort: 2000 }]
          volumeMounts:
            - { name: pkgs, mountPath: /pkgs, readOnly: true }
      volumes:
        - name: pkgs
          persistentVolumeClaim: { claimName: codeapi-pkgs }
