# The only Kubernetes authority the control plane holds, and why it is this small.
#
# Until enterpriseaiframework-914 the control plane had NO Kubernetes RBAC at all — it ran
# on the namespace's `default` ServiceAccount, which is bound to nothing. The resident
# meter (Contract 3 of docs/design/records/agents-surface.md) needs two facts the pod
# cannot get any other way: which agent pods exist and when each one started, and how much
# CPU each has burnt. So this file grants exactly those two reads and nothing else.
#
# NUMBERED 39, BEFORE 40-control-plane.yaml. deploy/bin/deploy.sh applies every manifest in
# lexical order, and the Deployment names this ServiceAccount — applying it first means a
# fresh cluster never has a control-plane pod referencing an account that does not exist
# yet.
#
# WHAT IS DELIBERATELY NOT GRANTED, each with the reason:
#
#   * `nodes/proxy` — the obvious way to reach cAdvisor is
#     `/api/v1/nodes/<node>/proxy/metrics/cadvisor` through the API server. That verb
#     proxies the WHOLE kubelet API, `/exec` and `/run` included, which is a documented
#     privilege-escalation path to running commands on any node. Measured on this cluster:
#     with the ClusterRole below and nothing else, that URL returns 403 and the direct
#     kubelet scrape returns 200. The meter is therefore built to address the kubelet by
#     the pod's own `.status.hostIP`, which it already reads.
#   * `nodes` list/get — not needed, for the same reason: the node address arrives with the
#     pod, so the meter never enumerates nodes.
#   * anything in the agents' or workspaces' ServiceAccounts. Those stay bound to nothing
#     and keep `automountServiceAccountToken: false` (60-workspace-common.yaml,
#     63-agent-common.yaml). This file widens the CONTROL PLANE, which is already the
#     component that administers everything, and widens nothing that runs user code.
#   * cluster-scoped write of any kind. `control-plane-agent-writer` below is the grant
#     enterpriseaiframework-627 needed and it is a namespaced Role, not a ClusterRole. The
#     only cluster-scoped object in this file remains `nodes/metrics`, which is read.
#
# NETWORK: no NetworkPolicy in this namespace selects the control-plane pod
# (`workspace-isolation` selects component=workspace, `agent-isolation` selects
# component=agent), so its egress to the API server and to the kubelet needs no rule and
# none is added here. If a default-deny is ever introduced for this pod, it needs egress to
# the API server on 443 and to the node addresses on 10250, and that belongs next to the
# deny — not here.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: control-plane
---
# Namespaced, because agents are. The meter never looks outside enterprise-ai.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-pod-reader
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: control-plane
rules:
  # `.status.startTime` is the resident-time source; `.status.hostIP` is how the compute
  # scrape finds the right kubelet; the `agent.enterprise-ai/*` labels are the attribution
  # key. All three are fields of a pod, so one read serves the whole meter.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # metrics-server's namespaced API. NOT what the meter uses — it is an instantaneous
  # gauge, and the design record rejects it as a meter for exactly that reason: a missed
  # sample is lost forever and the total can never be reconciled. It is granted because it
  # is namespaced, read-only and strictly weaker than the pod read above, and it lets an
  # operator cross-check a live agent's CPU against `kubectl top` from the same identity.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-pod-reader
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-pod-reader
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: enterprise-ai
---
# THE WRITE GRANT (enterpriseaiframework-627), and the reason it is shaped like this.
#
# The Agents tab lets a signed-in person create, stop and delete their own agent. Contract
# 2 of docs/design/records/agents-surface.md defines each of those as a concrete Kubernetes
# action on a concrete object, so the control plane — which is the only component that
# knows who the caller is — has to be able to perform them. There is no way to build the
# surface without this grant, and there is no smaller grant that builds it.
#
# WHAT MAKES IT NARROW, itemised, because "narrow" is a claim and not a description:
#
#   * NAMESPACED. A Role and a RoleBinding, both in enterprise-ai. Nothing here can touch
#     an object in kube-system, in a training namespace, or in any namespace this platform
#     does not own. Compare `control-plane-node-metrics` below, which is the one grant in
#     this file that leaves the namespace, and is a read of one subresource.
#   * FIVE RESOURCE KINDS, exactly the five an agent is made of. Not `*`.
#   * NO `escalate`, NO `bind`, NO rbac.authorization.k8s.io of any kind, so this account
#     cannot widen itself. Granting write on `roles`/`rolebindings` to a component that
#     already holds write is the classic path from "can create a Deployment" to "is
#     cluster-admin", and it is absent on purpose.
#   * `pods/exec` (create) IS granted — the one addition of the Hermes retarget, and a
#     deliberate posture change from the opencode design, which refused it because that
#     console was an HTTP proxy to the agent's own port. `hermes gateway run` opens no port,
#     so the console attaches `hermes --tui` over the exec subresource instead
#     (control-plane/app/agent_console.py, retarget record R3). It is scoped by the SAME
#     owner guard everything else here relies on: agents.console_target() resolves the pod
#     from the authenticated identity and re-checks its owner label before this account ever
#     names a pod to exec — RBAC itself cannot express "only my own pods" (see below).
#     `pods/attach` and `pods/portforward` remain absent; exec is the only shell path, and
#     it runs a fixed command (`hermes --tui`), not an arbitrary one the caller supplies.
#   * NO `serviceaccounts`, NO `networkpolicies`. The agent ServiceAccount is bound to
#     nothing and the agent NetworkPolicy is the fence around every agent pod; both are
#     deploy-time objects in 63-agent-common.yaml. A control plane that could rewrite them
#     could hand a user's agent an API token or open its egress, and no amount of care in
#     app/agents.py would help.
#
# WHAT THIS GRANT CANNOT DO, AND WHERE THE REAL GUARD IS
#
# Kubernetes RBAC has no notion of "only the objects whose owner label matches the person
# who asked". It is per-verb and per-kind, so within enterprise-ai this account really can
# delete any agent, any workspace Secret and any ConfigMap. That is unavoidable, and it
# means THE OWNER SCOPING IN control-plane/app/agents.py IS THE ENTIRE ISOLATION BOUNDARY
# between one user and another. It is enforced twice there — the object name is derived
# from the authenticated identity, and the object's own `agent.enterprise-ai/user` label is
# then checked against that identity, because two different (user, name) pairs can derive
# one object name when either contains a hyphen. control-plane/tests/test_portal_agents.py
# tests that as a security control, and tests-live/test_portal_agents.py proves it with a
# real second identity against this cluster. If those tests are ever weakened, this grant
# is what they were holding back.
#
# Secrets are in the list and that deserves its own line: an agent's Secret holds a
# spendable virtual key, and `create` is how it gets one at all. `delete` is here so that
# Contract 2's `deleted` cannot leave a live credential behind — a half-deleted agent whose
# Secret survived is a key nobody is watching, which is strictly worse than the grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-agent-writer
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # `patch` covers both directions of Contract 2's scale transition (replicas 0 and 1)
    # and server-side apply. `deployments/scale` is deliberately not requested: patching
    # the object we already fully manage needs no second subresource.
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["create", "get", "list", "patch", "delete"]
  # The console. `create` on pods/exec is how the API server opens the exec stream that
  # runs `hermes --tui` in the caller's own agent pod (agent_console.py). Owner-scoped in
  # agents.console_target(), never here — RBAC is per-kind, not per-owner-label.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-agent-writer
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-agent-writer
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: enterprise-ai
---
# CLUSTER-SCOPED, because a node is. This is the one grant in this file that leaves the
# namespace, and it is the narrowest subresource that reaches a real CPU counter:
# `nodes/metrics` authorises GET on the kubelet's /metrics* endpoints and nothing else —
# not /exec, not /run, not /pods, not the container logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-node-metrics
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-plane-node-metrics
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane-node-metrics
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: enterprise-ai
