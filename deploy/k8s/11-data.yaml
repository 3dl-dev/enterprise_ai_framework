# Valkey (cache) and Mongo (the chat surface's own store).
#
# Valkey has no PVC on purpose: it is an exact-match response cache, so losing it costs a
# cache miss, not data. Mongo does get one — it holds conversations.
#
# Same local-path storage warning as Postgres: a k3s-worker rebuild destroys these.
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: enterprise-ai
spec:
  selector: { app: valkey }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: enterprise-ai
spec:
  replicas: 1
  selector: { matchLabels: { app: valkey } }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          # No persistence: a cache that survives a restart is not worth a volume here.
          args: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: chatdb
  namespace: enterprise-ai
spec:
  clusterIP: None
  selector: { app: chatdb }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chatdb
  namespace: enterprise-ai
spec:
  serviceName: chatdb
  replicas: 1
  selector: { matchLabels: { app: chatdb } }
  template:
    metadata:
      labels: { app: chatdb }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ["--quiet"]
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { memory: "2Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
# Meilisearch: backs LibreChat's own conversation search (enterpriseaiframework-2a6).
# MIT-licensed core (LICENSE-MIT in getmeili/meilisearch) — only the separate
# Enterprise Edition file (LICENSE-EE, BSL-1.1) is not what runs here. Same
# durability posture as chatdb above: it holds a derived index over LibreChat's own
# Mongo state, not anything of ours, so a PVC belongs here for the same reason.
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: enterprise-ai
spec:
  selector: { app: meilisearch }
  ports: [{ port: 7700, targetPort: 7700 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: enterprise-ai
spec:
  serviceName: meilisearch
  replicas: 1
  selector: { matchLabels: { app: meilisearch } }
  template:
    metadata:
      labels: { app: meilisearch }
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.11
          env:
            - name: MEILI_MASTER_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: MEILI_MASTER_KEY } }
            - { name: MEILI_ENV, value: "production" }
            # Air-gap capable: stops Meilisearch's own anonymous-usage ping to ITS
            # telemetry endpoint (not 3DL's — there is none in this path either way).
            - { name: MEILI_NO_ANALYTICS, value: "true" }
          ports: [{ containerPort: 7700 }]
          volumeMounts: [{ name: data, mountPath: /meili_data }]
          readinessProbe:
            httpGet: { path: /health, port: 7700 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { memory: "1Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
