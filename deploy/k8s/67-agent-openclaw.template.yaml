# One named, resident OPENCLAW agent instance — the Agents pillar (gateway agents), the
# sibling of 65-agent-hermes.template.yaml. Rendered by control-plane/app/agents.py
# render_openclaw(); the placeholders are substituted literally, so this file is not
# applyable on its own.
#
#   __USER__          Keycloak username; with __NAME__ it forms every object name
#   __NAME__          the user-chosen agent slug
#   __IMAGE__         ghcr.io/openclaw/openclaw:<tag> (MIT)
#   __MODEL_SOURCE__  `integrated` or `byo` (agents-surface Contract 4) — provenance label
#   __KEY_SECRET__    the Secret holding OPENAI_API_KEY (the integrated virtual key, alias
#                     <user>::agents/<name>). openclaw's config reads it as ${OPENAI_API_KEY}.
#   __CFGSUM__        checksum of the first-boot seed ConfigMap (agent-<user>-<name>-config)
#   __KEYSUM__        checksum of the integrated key, so a real rotation rolls the pod
#
# WHAT DIFFERS FROM HERMES (agents-gateway-console.md, openclaw column of Contracts B/C/D,
# confirmed against ghcr.io/openclaw/openclaw 2026.9.6 by enterpriseaiframework-ff7):
#
#   * ONE container, ONE port. `openclaw gateway run` serves the Control UI on the gateway's
#     own port 18789 (HTTP and WebSocket on the same listener) — there is no separate
#     dashboard process and no console credential Secret. Auth is `trusted-proxy`: the
#     control-plane console proxy authenticates the portal user (Keycloak) and asserts the
#     identity in a header; the gateway trusts that header only from the pod network
#     (`gateway.trustedProxies`) AND only for the owner (`allowUsers`). The NetworkPolicy in
#     66-agent-console-common.yaml already admits 18789 from the control-plane pod alone.
#   * TWO state directories on the one PVC, via subPath: ~/.openclaw (openclaw.json,
#     sqlite sessions) and ~/.config/openclaw (the encryption key). Losing the second while
#     keeping the first makes the stored credentials unreadable.
#   * The gateway runs as uid 1000 (`node`), so fsGroup is 1000, not hermes's 10000.
#   * The config is JSON, seeded FIRST-BOOT ONLY like hermes's (Contract B): the initContainer
#     copies it iff the PVC has none, and openclaw's own config writer (the Control UI, the
#     `config.patch` admin RPC the control plane drives for a model change) owns it after.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-__USER__-__NAME__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-__USER__-__NAME__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
spec:
  selector:
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
  ports:
    - name: console
      port: 18789
      targetPort: 18789
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-__USER__-__NAME__
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-ai-framework
    app.kubernetes.io/component: agent
    agent.enterprise-ai/user: "__USER__"
    agent.enterprise-ai/name: "__NAME__"
    agent.enterprise-ai/model-source: "__MODEL_SOURCE__"
    agent.enterprise-ai/type: openclaw
spec:
  replicas: 1
  # Recreate: the PVC is ReadWriteOnce and the gateway holds a lock on its state directory,
  # so a rolling update would have two gateways fighting over one volume.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
      agent.enterprise-ai/user: "__USER__"
      agent.enterprise-ai/name: "__NAME__"
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: enterprise-ai-framework
        app.kubernetes.io/component: agent
        agent.enterprise-ai/user: "__USER__"
        agent.enterprise-ai/name: "__NAME__"
        agent.enterprise-ai/model-source: "__MODEL_SOURCE__"
        agent.enterprise-ai/type: openclaw
      annotations:
        # The seed is first-boot-only, so this checksum changing does NOT re-seed a running
        # agent; it exists so the pod template still changes when a NEW agent's seed does.
        checksum/config: "__CFGSUM__"
        checksum/api-key: "__KEYSUM__"
    spec:
      serviceAccountName: agent
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: config-seed
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          # Runs as ROOT (CHOWN/FOWNER/DAC_OVERRIDE only; the second boot finds the dirs already
          # 0700 and owned by uid 1000), because a fresh local-path PVC directory is owned by
          # root and openclaw (uid 1000) `fchmod`s its state directories and rewrites its
          # config atomically: on a root-owned directory every write — every `config.patch`,
          # every Control UI settings change — fails EPERM ("gateway method failed before
          # returning a response"), found by running it (enterpriseaiframework-ff7). The
          # ConfigMap volume is also 0444 and `cp` keeps that mode, so the seeded file is
          # made 0600. Order matters: chmod while root still owns, chown last.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"] }
          command:
            - sh
            - -c
            - |
              set -e
              C=/home/node/.openclaw/openclaw.json
              [ -f "$C" ] || cp /seed/openclaw.json "$C"
              chmod 700 /home/node/.openclaw /home/node/.config/openclaw
              chmod 600 "$C"
              chown 1000:1000 /home/node/.openclaw /home/node/.config/openclaw "$C"
          volumeMounts:
            - { name: data, mountPath: /home/node/.openclaw, subPath: openclaw }
            - { name: data, mountPath: /home/node/.config/openclaw, subPath: config }
            - { name: seed, mountPath: /seed, readOnly: true }
      containers:
        - name: agent
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["openclaw"]
          args: ["gateway", "run"]
          env:
            # Read by the config's `apiKey: "${OPENAI_API_KEY}"` — the integrated virtual
            # key, so every token rides <user>::agents/<name> on the one bill.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: __KEY_SECRET__, key: OPENAI_API_KEY }
          ports:
            - { name: console, containerPort: 18789 }
          volumeMounts:
            - { name: data, mountPath: /home/node/.openclaw, subPath: openclaw }
            - { name: data, mountPath: /home/node/.config/openclaw, subPath: config }
          resources:
            requests: { cpu: "200m", memory: "1Gi", ephemeral-storage: "1Gi" }
            limits:   { cpu: "1",    memory: "3Gi", ephemeral-storage: "4Gi" }
          # /healthz is the gateway's unauthenticated liveness route; every Control UI path
          # is behind trusted-proxy auth and would 403 a kubelet probe.
          startupProbe:
            httpGet: { path: /healthz, port: 18789 }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: 18789 }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: agent-__USER__-__NAME__ }
        - name: seed
          configMap: { name: agent-__USER__-__NAME__-config, defaultMode: 0444 }
