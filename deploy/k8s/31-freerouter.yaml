# freerouter — the inference spoke (docs/design/records/freerouter-reference-router.md).
#
# Bundled, self-hosted, air-gap DEFAULT: personal-gateway profile, its own meter in the
# welded postgres (the `freerouter` database), NO provider keys and NO router.3dl.one peer
# here — those are 3DL-overlay config only (guardrail enterpriseaiframework-bd6). During the
# transition it runs ALONGSIDE the LiteLLM gateway (30-gateway.yaml); retiring LiteLLM
# (enterpriseaiframework-f24) is gated on freerouter gaining native Anthropic inbound
# (freerouter-887). Empty catalog until EAF's providers are onboarded
# (enterpriseaiframework-8e0) — it comes up healthy and serves {"data":[]}.
#
# Image: built by deploy/bin/kaniko-build.sh from the freerouter checkout and substituted by
# hand, exactly like the other custom images (mcp-echo, fakeprovider, codeapi). deploy.sh
# HOLDS BACK any manifest still carrying `image: REPLACED_BY_DEPLOY` it does not itself build,
# so this is applied once its image is built + the tag substituted — never applied blind.
apiVersion: v1
kind: Service
metadata:
  name: freerouter
  namespace: enterprise-ai
spec:
  selector: { app: freerouter }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# Exposed on a NodePort so the coding surfaces and any direct-to-spoke client can reach it
# from the LAN or tailnet, mirroring the gateway. Not fronted by Caddy: not published to the
# internet in this deployment; the chat surface reaches it in-cluster.
apiVersion: v1
kind: Service
metadata:
  name: freerouter-nodeport
  namespace: enterprise-ai
spec:
  type: NodePort
  selector: { app: freerouter }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30480
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freerouter
  namespace: enterprise-ai
spec:
  replicas: 1
  selector: { matchLabels: { app: freerouter } }
  template:
    metadata:
      labels: { app: freerouter }
    spec:
      containers:
        - name: freerouter
          image: REPLACED_BY_DEPLOY
          env:
            - name: FREEROUTER_PROFILE
              value: personal-gateway
            - name: FREEROUTER_METER_BACKEND
              value: postgres
            # postgresql://<user>:<pass>@postgres:5432/freerouter — built by deploy.sh into
            # the enterprise-ai-secrets secret, same shape as GATEWAY_DATABASE_URL.
            - name: FREEROUTER_METER_DSN
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_METER_DSN } }
            - name: FREEROUTER_LISTEN_ADDR
              value: ":8080"
            # --- UPSTREAM TENANCY + AUTO-REPLENISH (3DL overlay; enterpriseaiframework-064).
            # router.3dl.one is consumed as a standard TENANT (identity_passthrough descriptor in
            # the catalog dir → canonical model ids, no masking). settlement_type usdc-voucher: the
            # buyer thermostat keeps the balance-on-router topped up via signed EIP-3009 vouchers
            # (buyer wallet → seller payout). All from the secret, absent in base (empty catalog,
            # no thermostat) per guardrail bd6.
            - name: FREEROUTER_CATALOG_DIR
              value: /etc/freerouter/catalog
            # Legacy→canonical model-id aliases (soft migration, freerouter-149): stored surface
            # configs referencing model@provider ids resolve to the upstream's canonical id.
            - name: FREEROUTER_CATALOG_ALIASES
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_CATALOG_ALIASES, optional: true } }
            - name: FREEROUTER_ROUTER_TENANT_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_ROUTER_TENANT_KEY, optional: true } }
            - name: FREEROUTER_REPLENISH_ENABLED
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_ENABLED, optional: true } }
            - name: FREEROUTER_REPLENISH_UPSTREAM_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_UPSTREAM_URL, optional: true } }
            - name: FREEROUTER_REPLENISH_TENANT_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_TENANT_KEY, optional: true } }
            - name: FREEROUTER_REPLENISH_SELLER_PAYOUT
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_SELLER_PAYOUT, optional: true } }
            - name: FREEROUTER_REPLENISH_ALERT_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_ALERT_URL, optional: true } }
            - name: FREEROUTER_REPLENISH_LOW_MICRO
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_LOW_MICRO, optional: true } }
            - name: FREEROUTER_REPLENISH_HIGH_MICRO
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_HIGH_MICRO, optional: true } }
            - name: FREEROUTER_REPLENISH_HARD_FLOOR_MICRO
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_HARD_FLOOR_MICRO, optional: true } }
            - name: FREEROUTER_REPLENISH_WALLET_AUTOREFILL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_WALLET_AUTOREFILL, optional: true } }
            - name: FREEROUTER_REPLENISH_WALLET_LOW_MICRO
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_WALLET_LOW_MICRO, optional: true } }
            - name: FREEROUTER_REPLENISH_WALLET_HARD_FLOOR_MICRO
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_WALLET_HARD_FLOOR_MICRO, optional: true } }
            - name: FREEROUTER_REPLENISH_POLL_SECONDS
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_POLL_SECONDS, optional: true } }
            - name: FREEROUTER_REPLENISH_TENANT_ACCOUNT_ID
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_REPLENISH_TENANT_ACCOUNT_ID, optional: true } }
            # Signup open so the control plane can broker per-user sub-account provisioning
            # (757/1da). Safe: in-cluster / NodePort only, never internet-published — enforced
            # by the posture guard (tests/test_freerouter_posture.py).
            - name: FREEROUTER_SIGNUP
              value: open
            # --- 3DL-OVERLAY ONLY (guardrail bd6): all absent in the shipped base, so it
            # stays an air-gap personal gateway with no tab and no peer. The 3DL deploy's
            # secret sets these to turn ai.3dl.one into the cred-less federated BUYER + give
            # its users the operator tab (171 recast; without it a zero-balance sub-account
            # 402s post-0d4). The self-pay canary becomes a pure secret/overlay exercise —
            # no manifest edit — once the peer's 971 buyer half lands.
            - name: FREEROUTER_OPERATOR_TAB_MICRO
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_OPERATOR_TAB_MICRO, optional: true } }
            - name: FREEROUTER_PEER_SERVE
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_SERVE, optional: true } }
            - name: FREEROUTER_PEER_TESTNET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_TESTNET, optional: true } }
            - name: FREEROUTER_PEER_SETTLEMENT_CHAIN_ID
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_SETTLEMENT_CHAIN_ID, optional: true } }
            - name: FREEROUTER_PEER_ALLOWLIST
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_ALLOWLIST, optional: true } }
            - name: FREEROUTER_PEER_UPSTREAMS
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_UPSTREAMS, optional: true } }
            - name: FREEROUTER_PEER_RELAY_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_RELAY_URL, optional: true } }
            # --- MAINNET custody (3DL-OVERLAY ONLY, guardrail bd6; all absent in the shipped
            # base, so it stays a testnet-only air-gap gateway). Mainnet is NEVER auto-minted:
            # the settlement key is a DELIBERATELY-PROVISIONED secp256k1 key injected as a Key
            # Vault secret (FREEROUTER_PEER_WALLET_KEY_HEX), which by code takes PRECEDENCE over
            # the testnet keystore below — so the keystore's mainnet-forbidden guard never fires.
            # FREEROUTER_PEER_MAINNET_ENABLED=true is the explicit prod opt-in that lets
            # settlement use a real-value mainnet chain (ChainAllowed), and RPC_URL points at the
            # chain. All three live in the secret (the operator provisions them), never here as a
            # literal — the manifest only names the wiring. Absent ⇒ testnet self-mint, unchanged.
            - name: FREEROUTER_PEER_WALLET_KEY_HEX
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_WALLET_KEY_HEX, optional: true } }
            - name: FREEROUTER_PEER_NOSTR_KEY_HEX
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_NOSTR_KEY_HEX, optional: true } }
            - name: FREEROUTER_PEER_MAINNET_ENABLED
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_MAINNET_ENABLED, optional: true } }
            - name: FREEROUTER_PEER_RPC_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_PEER_RPC_URL, optional: true } }
            # secp256k1 testnet settlement wallet; the FR self-generates it here on boot if
            # the file is absent (mainnet keystore forbidden by code). Ignored when
            # FREEROUTER_PEER_WALLET_KEY_HEX is set (which wins). On the small PVC below.
            - name: FREEROUTER_PEER_WALLET_KEYSTORE
              value: /var/lib/freerouter/wallet/testnet.key
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { memory: "1Gi" }
          volumeMounts:
            # Self-generated testnet settlement wallet (3DL overlay / canary). Empty in the
            # base — the FR writes it only when FREEROUTER_PEER_* turns federation on.
            - { name: freerouter-wallet, mountPath: /var/lib/freerouter/wallet }
            # Upstream-tenancy onboarding bundle (router.3dl.one, identity_passthrough). optional:
            # base has no overlay catalog and comes up empty.
            - { name: freerouter-catalog, mountPath: /etc/freerouter/catalog, readOnly: true }
      volumes:
        - name: freerouter-wallet
          persistentVolumeClaim: { claimName: freerouter-wallet }
        - name: freerouter-catalog
          configMap: { name: freerouter-catalog, optional: true }
---
# Durable store for the freerouter testnet settlement wallet (3DL overlay / canary). Tiny.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freerouter-wallet
  namespace: enterprise-ai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 16Mi } }
