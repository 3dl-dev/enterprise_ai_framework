# The control plane — identity reconcile, virtual keys, budgets, the bill, the audit
# trail, and the portal a person actually signs in to.
#
# WHAT IS AND IS NOT EXPOSED
#
# The admin API is still guarded by a single shared static bearer token, which is not a
# security model worth publishing (dogfood-findings.md finding 11). It stays ClusterIP —
# reach it with:
#
#   kubectl -n enterprise-ai port-forward svc/control-plane 8081:8000
#
# The PORTAL is published, through a second Service and an oauth2-proxy sidecar that
# authenticates against Keycloak first. That does not weaken the finding-11 mitigation:
# oauth2-proxy proves who you are, and /admin/* still demands the admin token, which no
# browser has. Authentication is not authorisation.
#
# The portal trusts the sidecar's identity headers only for requests arriving from
# 127.0.0.1 — see control-plane/app/portal.py. That is why the sidecar is a sidecar and
# not its own pod, and why uvicorn runs with --no-proxy-headers.
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: enterprise-ai
spec:
  selector: { app: control-plane }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
# The authenticated front door. Separate Service so the admin port is never the thing
# published — routing to 4180 can only ever reach the app through the proxy.
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: enterprise-ai
spec:
  type: NodePort
  selector: { app: control-plane }
  ports:
    - name: proxy
      port: 4180
      targetPort: 4180
      nodePort: 30460
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: enterprise-ai
spec:
  replicas: 1
  selector: { matchLabels: { app: control-plane } }
  template:
    metadata:
      labels: { app: control-plane }
    spec:
      # The OIDC backchannel resolves the public hostname to the gateway VM's LAN
      # address. Same reasoning as the chat surface and the workspaces: the cluster is
      # not on the tailnet, so the funnel hostname would resolve to the public ingress
      # and the connection is reset — while the issuer string must stay byte-identical
      # on both sides or the token is rejected.
      hostAliases:
        - ip: "192.168.2.42"
          hostnames: ["gateway.tailcb6ef9.ts.net"]
      # The pod's own account, so the resident meter's two reads (agent pods, and the
      # kubelet's cAdvisor counter) are bound to THIS workload and not to the namespace's
      # `default` account, which every other pod without an explicit account also uses.
      # Everything it may do is in 39-control-plane-rbac.yaml, which is applied first.
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          # Built from ../control-plane and pushed to the rail registry by deploy.sh.
          image: REPLACED_BY_DEPLOY
          env:
            - name: CONTROL_PLANE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CONTROL_PLANE_DATABASE_URL } }
            - name: GATEWAY_DATABASE_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: GATEWAY_DATABASE_URL } }
            - name: GATEWAY_URL
              value: http://gateway:4000
            - name: GATEWAY_MASTER_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: GATEWAY_MASTER_KEY } }
            # The inference spoke (item 757). GATEWAY_PROVIDER flips provisioning + the bill
            # from litellm to freerouter; absent → litellm, so this manifest is safe to ship
            # pre-flip. FREEROUTER_MASTER_KEY is the control plane's own tenant bearer —
            # bootstrapped + persisted to the keyfile volume below, or injected as a secret.
            # Values live in the 3DL overlay secret (bd6: never a shipped default).
            - name: GATEWAY_PROVIDER
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: GATEWAY_PROVIDER, optional: true } }
            - name: FREEROUTER_URL
              value: http://freerouter:8080
            - name: FREEROUTER_MASTER_KEY_FILE
              value: /var/lib/enterprise-ai/freerouter/operator.key
            - name: FREEROUTER_MASTER_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: FREEROUTER_MASTER_KEY, optional: true } }
            - name: IDP_URL
              value: http://identity:8080
            - name: IDP_REALM
              value: enterprise-ai
            - name: IDP_CLIENT_ID
              value: control-plane
            - name: IDP_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: IDP_CLIENT_SECRET } }
            - name: CONTROL_PLANE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CONTROL_PLANE_ADMIN_TOKEN } }
            # ---- portal configuration ----
            - name: PUBLIC_BASE_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: PUBLIC_BASE_URL } }
            - name: PUBLISHED_INTERNAL_URL
              value: http://published
            # Read-only, one collection, two fields: the map from LibreChat's internal
            # user id to a username. Without it the chat surface's spend is a column of
            # hex and a user's own total silently omits chat. See app/chat_identity.py
            # for why this coupling is accepted and how it fails safe.
            - name: CHAT_MONGO_URL
              value: mongodb://chatdb:27017
            - name: CHAT_MONGO_DB
              value: librechat
            # The credential the portal presents to a workspace pod. The pod refuses to
            # start without its half of it, so a workspace can never come up reachable
            # but unauthenticated.
            #
            # There is deliberately no per-user host or port map here any more. The proxy
            # resolves a workspace from the AUTHENTICATED username to a Service name, so
            # adding a camper needs no configuration in this file — which is what the old
            # hand-maintained WORKSPACE_PORTS list required, and forgetting to update it
            # sent somebody to a link that hung.
            # Who sees the operator console. Explicit usernames, not a Keycloak role and
            # not the admin token: this is a READ-ONLY view of the bill, and seeing it
            # should not require holding the credential that can revoke every key.
            # Empty means no console at all, which is the safe direction to fail.
            - name: PORTAL_ADMINS
              value: "baron"
            - name: WORKSPACE_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: WORKSPACE_INTERNAL_TOKEN } }
            # How often the resident-usage meter samples agent pods
            # (enterpriseaiframework-914). Stated rather than left to the code's default so
            # an operator can find it. Longer is not less accurate for an agent that stays
            # up — CPU is a monotonic counter and loses nothing, and resident time is
            # accrued between ticks — it only widens the window lost when a pod appears
            # and disappears entirely between two samples.
            - name: AGENT_USAGE_SAMPLE_SECONDS
              value: "60"
            # Behavioural-analytics collector: where the content-free records store lives
            # (on a PVC, so it survives restarts and the operator report is not blank after
            # a roll), and how often the collector rebuilds it from chat Mongo + the gateway
            # ledger + each workspace's opencode db.
            - name: ANALYTICS_RECORDS_PATH
              value: /var/lib/enterprise-ai/analytics/records.jsonl
            - name: ANALYTICS_COLLECT_SECONDS
              value: "1800"
          ports: [{ containerPort: 8000 }]
          volumeMounts:
            # The agent object set and the resident entrypoint, so the portal's Agents tab
            # can render a real agent (enterpriseaiframework-627). They live under
            # deploy/, and this image is built from control-plane/ alone, so a ConfigMap
            # is how they arrive — exactly the way provision-agent.sh already delivers the
            # entrypoint to an agent pod. Mounting THE SAME FILES the operator script
            # renders is the point: a Python copy of the Deployment shape would drift from
            # deploy/k8s/64-agent.template.yaml and the drift would be invisible until an
            # agent came up different from a hand-provisioned one.
            #
            # `optional: true` so a control plane deployed before the ConfigMap exists
            # still starts and serves chat, code, spend and keys; only agent CREATION
            # fails, and app/agents.py names this ConfigMap in the error when it does.
            - { name: agent-assets, mountPath: /etc/agent-assets, readOnly: true }
            # Writable, durable store for the behavioural-analytics records the collector
            # produces and the /portal/analytics report reads.
            - { name: analytics-records, mountPath: /var/lib/enterprise-ai/analytics }
            # Durable store for the freerouter operator-tenant bearer (item 757): a restart
            # reuses it rather than stranding a new empty tenant. Only written post-flip.
            - { name: freerouter-key, mountPath: /var/lib/enterprise-ai/freerouter }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { memory: "512Mi" }
        # ---------------------------------------------------------------- front door
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          args:
            - --provider=oidc
            - --client-id=portal
            - --scope=openid email profile
            - --http-address=0.0.0.0:4180
            # Loopback upstream. This is the whole basis on which the app trusts the
            # identity headers below — see portal.py. Do not change it to the pod IP.
            - --upstream=http://127.0.0.1:8000
            # oauth2-proxy's own endpoints live under the portal's path, not at the
            # origin root — the root of this origin is the chat surface, and a proxy
            # claiming /oauth2/* there would shadow it.
            - --proxy-prefix=/portal/oauth2
            # The terminal is a websocket. Without this the Code tab loads its chrome,
            # the socket never upgrades, and it reads as a hung agent rather than a
            # proxy setting — the same failure the workspace sidecar hit.
            - --proxy-websockets=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --session-store-type=cookie
            - --cookie-name=_portal_auth
            # Every realm user may sign in to the portal; what they SEE is scoped to
            # themselves by the app. Unlike a workspace, there is no per-pod allow-list,
            # because the portal is not a shell holding somebody's spendable key.
            - --email-domain=*
            # Served over the funnel's TLS, but reachable on the LAN as plain HTTP too;
            # a Secure cookie would never come back over the latter and login would loop.
            - --cookie-secure=false
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: OPENID_ISSUER } }
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: PORTAL_REDIRECT_URL } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: PORTAL_CLIENT_SECRET } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: PORTAL_COOKIE_SECRET } }
          ports: [{ name: proxy, containerPort: 4180 }]
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
      volumes:
        # Built from the repository by deploy/bin/deploy.sh, not hand-written here: a
        # 265-line template pasted into a ConfigMap manifest is a second copy that nobody
        # would notice going stale.
        - name: agent-assets
          configMap: { name: agent-assets, optional: true }
        - name: analytics-records
          persistentVolumeClaim: { claimName: analytics-records }
        - name: freerouter-key
          persistentVolumeClaim: { claimName: freerouter-operator-key }
---
# Durable store for the freerouter operator-tenant bearer (item 757). Tiny; RWO,
# single-replica; local-path like the rest of this cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freerouter-operator-key
  namespace: enterprise-ai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 16Mi } }
---
# Durable store for the behavioural-analytics records (content-free turn/session metrics +
# real ledger cost). RWO is fine — the control plane is single-replica. local-path like the
# rest of this cluster: a worker rebuild loses it, and the collector simply rebuilds it on
# its next tick from the canonical sources, so nothing is permanently lost.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-records
  namespace: enterprise-ai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
