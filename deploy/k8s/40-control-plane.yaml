# The control plane — identity reconcile, virtual keys, budgets, the bill, the audit trail.
#
# ClusterIP only, with NO NodePort and NO ingress. That is the mitigation for
# dogfood-findings.md finding 11: its admin API is guarded by a single shared static
# bearer token, which is not a security model worth exposing. Reach it with:
#
#   kubectl -n enterprise-ai port-forward svc/control-plane 8081:8000
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: enterprise-ai
spec:
  selector: { app: control-plane }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: enterprise-ai
spec:
  replicas: 1
  selector: { matchLabels: { app: control-plane } }
  template:
    metadata:
      labels: { app: control-plane }
    spec:
      containers:
        - name: control-plane
          # Built from ../control-plane and pushed to the rail registry by deploy.sh.
          image: REPLACED_BY_DEPLOY
          env:
            - name: CONTROL_PLANE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CONTROL_PLANE_DATABASE_URL } }
            - name: GATEWAY_DATABASE_URL
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: GATEWAY_DATABASE_URL } }
            - name: GATEWAY_URL
              value: http://gateway:4000
            - name: GATEWAY_MASTER_KEY
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: GATEWAY_MASTER_KEY } }
            - name: IDP_URL
              value: http://identity:8080
            - name: IDP_REALM
              value: enterprise-ai
            - name: IDP_CLIENT_ID
              value: control-plane
            - name: IDP_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: IDP_CLIENT_SECRET } }
            - name: CONTROL_PLANE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: enterprise-ai-secrets, key: CONTROL_PLANE_ADMIN_TOKEN } }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { memory: "512Mi" }
